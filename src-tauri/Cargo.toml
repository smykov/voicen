[package]
name = "voicen"
description = "Voicen: dictate into any input field"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "voicen_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
# No lib doctest exe, which build.rs cannot give the release exe's Windows link configuration
# (T-035, T-038, docs/decisions/ci-toolchain.md); cargo test --doc ignores this key, so make
# check refuses removing it and any --doc or rustdoc in .github/workflows. Doc blocks are not checked.
doctest = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
voicen-core = { path = "../crates/voicen-core" }
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Credential Manager (T-030, spec 004 T016), the OS UI language (spec 004 T049) and
# the HKCU Run value (T-014, spec 004 T057).
# Already in Cargo.lock via tao/wry (0.62.2): feature flags only, no new crate (#9).
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Security_Credentials", "Win32_Globalization", "Win32_System_Registry"] }

# Test-only (T-030 J4): never in the release dependency graph.
[dev-dependencies]
voicen-core = { path = "../crates/voicen-core", features = ["test-fakes"] }
tauri = { version = "2", features = ["test"] }
