[package]
name = "voicen"
description = "Voicen: dictate into any input field"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "voicen_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
# No lib unit-test or doctest exe, which build.rs cannot give the release exe's Windows link
# configuration (F-002; T-035, T-038, T-092, docs/decisions/ci-toolchain.md). cargo test --lib,
# --all-targets and --doc ignore these keys; line 1 of src/lib.rs empties the crate under test and
# doctest for every selector. make check (scripts/ci/shell-test-layout.sh) compares cargo's own
# target list with scripts/ci/shell-targets.txt and line 1 with its pin.
test = false
doctest = false

# The bin's unit-test exe is off too (plain cargo test); line 1 of src/main.rs empties the crate
# under --bins / --all-targets (T-092).
[[bin]]
name = "voicen"
test = false

[features]
# tests/ban_canary.rs, the probes that scripts/ci/ban-canary.sh (make check-ban-canary) lints with
# this package's lint config to prove the clock ban bites (T-201). Test tooling only; never enabled
# in a build that ships.
ban-canary-tests = []

# T-201: the one lint that reads the package lint config file (the clock ban) at deny, for every target of
# this package, without -D warnings: the other lints stay warnings (T-166 owns them). The lib is
# exempt through one owned crate-level allow in src/lib.rs; the tests are not. Proven to bite by
# make check-ban-canary; every line naming the lint tool is an owned line (T-089 token guard).
[lints.clippy]
disallowed_methods = "deny"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
voicen-core = { path = "../crates/voicen-core" }
# The bundled speech detector (T-102, src/vad.rs): the first link of whisper.cpp into voicen.exe.
voicen-whisper = { path = "../crates/voicen-whisper" }
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Single instance (T-052): registered first and only by `run()`; its second-instance path
# calls process::exit(0) inside tauri's build(), so no test registers it.
tauri-plugin-single-instance = "2.5"

# Credential Manager (T-030, spec 004 T016), the OS UI language (spec 004 T049),
# the HKCU Run value (T-014, spec 004 T057), the models dir free space (T-044) and
# the local UTC offset of the log's timestamps (T-008, Win32_System_Time) and the runner
# probe (T-059, tests/runner_probe.rs: window, keyboard, clipboard, session and desktop;
# declared even where tao already enables them, so this one list names everything used),
# and the dictation adapters (T-006, src/win/: hotkey window and SendInput, clipboard formats,
# the start window's process and its integrity level through Win32_Security), and the overlay's
# placement (T-057, src/overlay.rs: the monitor of the window in front and its work area and DPI,
# Win32_Graphics_Gdi and Win32_UI_HiDpi; no main-thread round trip), and the tray's "Open logs
# folder" (T-071, src/win/shell_open.rs: ShellExecuteExW under CoInitializeEx, Win32_UI_Shell and
# Win32_System_Com), and the crash records (T-024, src/win/crash.rs: RtlCaptureStackBackTrace and
# SetUnhandledExceptionFilter, Win32_System_Diagnostics_Debug and Win32_System_Kernel; the module of
# an address, Win32_System_LibraryLoader; RtlGetVersion, Wdk_System_SystemServices and
# Win32_System_SystemInformation; WriteFile, Win32_System_IO), and the call mode's device
# notifications and communications check (T-150, src/win/audio_notify.rs: IMMDeviceEnumerator and
# IMMNotificationClient, Win32_Media_Audio, under CoInitializeEx, Win32_System_Com; ids only, no
# property store).
# Already in Cargo.lock via tao/wry (0.62.2): feature flags only, no new crate (#9).
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Credentials", "Win32_Globalization", "Win32_System_Registry", "Win32_Storage_FileSystem", "Win32_System_Time", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_Ole", "Win32_System_Threading", "Win32_System_StationsAndDesktops", "Win32_System_RemoteDesktop", "Win32_Graphics_Gdi", "Win32_UI_HiDpi", "Win32_UI_Shell", "Win32_System_Com", "Win32_System_Diagnostics_Debug", "Win32_System_Kernel", "Win32_System_LibraryLoader", "Wdk_System_SystemServices", "Win32_System_SystemInformation", "Win32_System_IO", "Win32_System_Performance", "Win32_Media_Audio"] }
# T-150: `windows::core::implement` (the IMMNotificationClient of src/win/audio_notify.rs) expands
# to `::windows_core` paths, so the crate it names must be a direct dependency (cpal and tao do
# the same). Already in Cargo.lock at 0.62.2 (the `windows` crate's own core): no new crate.
windows-core = "0.62"
# The microphone (T-006, src/win/capture.rs; consented by #9): the Windows default input device
# over WASAPI. Its windows ^0.62 is the lock's 0.62.2, so no second windows version.
cpal = "0.18"

# Test-only (T-030 J4): never in the release dependency graph.
[dev-dependencies]
voicen-core = { path = "../crates/voicen-core", features = ["test-fakes"] }
tauri = { version = "2", features = ["test"] }

# Test-only (T-052): the tray tests dispatch the test thread's window messages while they wait
# (tray-icon's setters SendMessageW to the tray window the mock runtime builds on that thread).
# The same crate and version as above: a feature flag, no new crate (#9).
# T-006: tests/tray.rs deletes the tray's notification-area icon (Shell_NotifyIconW, Win32_UI_Shell)
# so a setter fails; tests/capture.rs builds cpal errors for the capture error map. Same crates and
# versions as above: feature flags only.
# T-057 (VERIFY_FAIL 3): tests/smoke_predicate.rs registers window classes the way
# tauri-plugin-single-instance and tao do (GetModuleHandleW, Win32_System_LibraryLoader).
# T-024: tests/crash.rs turns off the fault and abort error boxes of its children (SetErrorMode,
# Win32_System_Diagnostics_Debug) and plants crash files under the local time's names
# (GetLocalTime, Win32_System_SystemInformation). T-150: tests/call_notify.rs names the audio
# endpoint types (EDataFlow, ERole, DEVICE_STATE; Win32_Media_Audio) and PROPERTYKEY
# (Win32_Foundation). Feature flags only, no new crate.
[target.'cfg(windows)'.dev-dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Media_Audio", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_System_LibraryLoader", "Win32_System_Diagnostics_Debug", "Win32_System_SystemInformation"] }
cpal = "0.18"
