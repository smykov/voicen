# patch-guard.conf — defaults for scripts/hooks/patch-guard.sh (sourced by bash).
# To customise per project, copy to .teamwright/patch-guard.conf and edit there;
# that file wins over this one.

# warn | block — what to do when a patch signature lands in an area with prior fixes.
# Default warn: on an existing codebase almost every area has fix commits, and a
# guard that blocks everything is switched off within a week. Opt in to block once
# signatures are tuned (and never while adopting a legacy codebase).
PG_MODE=warn

# How many earlier fix commits make an area "already patched".
PG_PRIOR_FIXES=2

# Only fix commits from the last N days count (0 = whole history). Old fixes say
# little about a class that is recurring now.
PG_LOOKBACK_DAYS=90

# Area granularity for counting prior fixes: dir (the file's directory) | file.
# A file at the repository root is always its own area.
PG_AREA=dir

# Commit subjects that count as fixes (Python regex, case-insensitive).
PG_FIX_SUBJECT_RE='^(fix|bugfix|hotfix)(\(|:|!)|\bfix(es|ed)?\b'

# Files never inspected (Python regex on the repo-relative path).
PG_EXCLUDE_RE='(^|/)(tests?|spec|__tests__|fixtures|docs)/|^scripts/hooks/|\.(spec|test)\.[A-Za-z]+$|_test\.[A-Za-z]+$|\.(md|txt|lock|json|ya?ml|toml)$'

# Patch signatures: one per line, "name|python-regex", matched against ADDED lines.
# Tune them to your stack; noisy signatures train people to ignore the guard.
# They fingerprint "one more case" fixes: recogniser constants, allowlist items.
PG_SIGNATURES='allowlist-constant|\b[A-Z][A-Z0-9_]*(_RE|_REGEX|_PATTERN|_PATTERNS|_ALLOWLIST|_WHITELIST|_DENYLIST|_BLOCKLIST|_EXCEPTIONS|_IGNORE|_SKIP)\s*[:=]
list-item|^\s*["\x27][^"\x27\s]{1,60}["\x27]\s*,?\s*$'

# Opt-in: branches on a string literal (`if x == "foo"`). Off by default because
# it fires on most ordinary code; enable in .teamwright/patch-guard.conf with
#   PG_SIGNATURES="$PG_SIGNATURES
#   $PG_SIG_LITERAL_BRANCH"
PG_SIG_LITERAL_BRANCH='literal-branch|\b(if|elif|else if|case|when)\b.*(==|!=|\bin\b|\.includes\(|\.startsWith\(|\.endsWith\(|\.contains\(|\.match\().*["\x27][^"\x27]+["\x27]'
