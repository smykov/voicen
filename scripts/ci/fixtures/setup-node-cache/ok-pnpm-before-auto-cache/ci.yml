name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: pnpm on the host first
        uses: pnpm/action-setup@v4
        with:
          version: 8.15.0
      - uses: actions/setup-node@v5
        with:
          node-version: "20.19"
