name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-24.04
    steps:
      - name: Host node for the fixtures
        if: always()
        with:
          package-manager-cache: "false"   # no host pnpm in this job
          node-version: 20.19
        uses: 'actions/setup-node@v5' # pinned major
