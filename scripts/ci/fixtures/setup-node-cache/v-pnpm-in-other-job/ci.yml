name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  first:
    runs-on: ubuntu-24.04
    steps:
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          cache: pnpm
  second:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/setup-node@v5
        with:
          cache: pnpm
          package-manager-cache: false
