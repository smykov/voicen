# T-092 mechanism template (scripts/ci/shell-test-layout.test.sh): a toy crate with the
# shell's target switches. The test copies it to target/, writes src/lib.rs and src/main.rs as
# <pin line> + lib.rs.body / main.rs.body (and once without the pin line), and runs every cargo
# test selector in the core image. Not a guard case: it has no src/ until the test builds one.
[package]
name = "voicen"
version = "0.0.0"
edition = "2021"

[lib]
name = "voicen_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
test = false
doctest = false

[[bin]]
name = "voicen"
test = false

[workspace]
