# Fixture workflows dir for scripts/ci/shell-test-layout.test.sh (T-038); mirrors the cargo
# steps of .github/workflows/ci.yml. Its comment names doctests, which is not the doc flag.
name: CI
on:
  push:
    branches: [main]
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      # The shell's build script (tauri-build static VC runtime) puts a stub msvcrt.lib on its
      # search path; cargo gives every build script's search dirs (native_dirs) to every doctest
      # of the same invocation, so other crates' doctests must not share a run with `voicen` (T-033, F-001).
      - run: cargo test --workspace --exclude voicen --no-fail-fast
      - run: cargo test -p voicen --no-fail-fast
      - run: pnpm tauri build
