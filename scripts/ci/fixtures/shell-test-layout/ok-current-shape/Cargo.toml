# Fixture shell dir for scripts/ci/shell-test-layout.test.sh; never built.
[package]
name = "shell-layout-fixture"
version = "0.0.0"
edition = "2021"
publish = false

[lib]
name = "shell_layout_fixture_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
# Mirrors src-tauri/Cargo.toml: full-line comments that name the key pass (T-038).
# No lib doctest exe: build.rs cannot give it the release exe's Windows link configuration
# (T-035, docs/decisions/ci-toolchain.md). make check refuses removing this doctest key;
# doc blocks are not checked.
  doctest = false   # make check refuses removing this key

[build-dependencies]
tauri-build = { version = "2", features = [] }

# T-038 review round 1, finding 1: single-line arrays and inline tables, nested on one line
# as in src-tauri/Cargo.toml, pass the one-line-per-value rule.
[dependencies]
voicen-core = { path = "../crates/voicen-core" }
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Security_Credentials", "Win32_Globalization", "Win32_System_Registry", "Win32_Storage_FileSystem"] }

[dev-dependencies]
voicen-core = { path = "../crates/voicen-core", features = ["test-fakes"] }
tauri = { version = "2", features = ["test"] }
