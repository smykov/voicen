[[bin]]
# Fixture shell dir for scripts/ci/shell-test-layout.test.sh; never built. Line 1 starts with
# a UTF-8 byte order mark (EF BB BF), so it cannot carry this comment.
# T-038 review round 2, finding 1 (b): cargo 1.99 strips the BOM and reads [[bin]] with the
# bin path ../outside/main.rs. The line did not start with [, so it was not read as a header
# and the path below it was not under a target table.
name = "voicen"
path = "../outside/main.rs"

[package]
name = "shell-layout-fixture"
version = "0.0.0"
edition = "2021"
publish = false

[lib]
name = "shell_layout_fixture_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
doctest = false
