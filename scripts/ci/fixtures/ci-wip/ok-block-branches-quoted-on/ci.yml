"on":
  pull_request:
    branches: [main]
  push:
    tags:
      - "v*"
    branches:
      - 'wip/**'   # pre-review runs
      - main
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
    - name: Save
      if: "github.ref=='refs/heads/main'"
      uses: actions/cache/save@v6
      with:
        path: x
        key: k
    - uses: Swatinem/rust-cache@v2
      with:
        save-if: ${{github.ref=='refs/heads/main'}}
    - uses: pnpm/action-setup@v4
      with:
        cache: false
    - run: |
        echo "a run script that names actions/cache@v6 in plain text"
