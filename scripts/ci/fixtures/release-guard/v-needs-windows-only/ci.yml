on:
  push:
    branches: [main, "wip/**"]
    tags: ["v*"]
  pull_request:
jobs:
  gate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - run: make check
  windows:
    runs-on: windows-2025
    needs: gate
    steps:
      - uses: actions/checkout@v5
      - name: Premise - release-check on every ref (no token)
        shell: bash
        env:
          TAG: v${{ env.VOICEN_VERSION }}
          RUN_NUMBER: ${{ github.run_number }}
        run: bash scripts/ci/release-check.sh "$TAG" "$RUN_NUMBER" . target/release/bundle/nsis
      - name: Probe
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: gh release view v0.1.0 || gh release list
      - uses: actions/upload-artifact@v4
        with:
          name: voicen-installer-abc1234
          path: target/release/bundle/nsis/*-setup.exe
  release:
    name: GitHub Release (v* tags only)
    needs: [windows]
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: voicen-installer-abc1234
          path: dist
      - name: Release check
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          RUN_NUMBER: ${{ github.run_number }}
        run: bash scripts/ci/release-check.sh "$TAG" "$RUN_NUMBER" . dist
      - name: Checksum
        run: cd dist && sha256sum *-setup.exe > SHA256SUMS.txt
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*-setup.exe dist/SHA256SUMS.txt --verify-tag --title "Voicen $GITHUB_REF_NAME" --notes-file notes.md
