on:
  push:
    branches: [main, "wip/**"]
    tags: ["v*"]
    paths-ignore: ["docs/tasks/**"]
  pull_request:
permissions:
  contents: read
jobs:
  gate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - run: make check
  windows:
    runs-on: windows-2025
    needs: gate
    steps:
      - uses: actions/checkout@v5
      - name: Premise - release-check on every ref (no token)
        shell: bash
        env:
          TAG: v${{ env.VOICEN_VERSION }}
          RUN_NUMBER: ${{ github.run_number }}
        run: bash scripts/ci/release-check.sh "$TAG" "$RUN_NUMBER" . target/release/bundle/nsis
      - name: Send the installer to Telegram
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: bash scripts/ci/telegram-send.sh target/release/bundle/nsis
      - uses: actions/upload-artifact@v4
        with:
          name: voicen-installer-abc1234
          path: target/release/bundle/nsis/*-setup.exe
