[package]
name = "voicen-core"
description = "Platform-independent core of Voicen: engines, pipeline, settings"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Base-URL rule (research R-8; decision #17).
url = "2"
# `Secret` zeroed on drop (data-model; decision #17).
zeroize = "1"
# OpenAI-compatible transcription client: blocking (decision #42, OQ-05 (a)),
# multipart upload, rustls with the platform verifier, system proxy (T-040, #44).
reqwest = { version = "0.13", default-features = false, features = ["blocking", "multipart", "rustls", "system-proxy"] }
# Capture rate -> 16 kHz resampling (T-040; rubato 5 needs Rust 1.87, decision #44).
rubato = "5"
thiserror = "2"
# Streamed SHA-256 of a downloaded model (T-016; consented in decision #50).
sha2 = "0.10"

[features]
# Public test fakes (FakeCredentialStore, FakeHotkeyRegistrar, FakeDownloadedModels,
# FakeAutostart)
# for this crate's integration tests and for other crates' tests (decision #23 N4).
# Never enabled in a release build.
test-fakes = []
# T-089 ban canary: ban-canary-lib compiles src/ban_canary.rs, ban-canary-tests
# tests/ban_canary.rs, the probes that scripts/ci/ban-canary.sh (make check-ban-canary) lints
# with the package's lint config to prove each call ban bites. Two features, two runs: a denied
# probe in the lib stops the build of every test target that links it. Test tooling only;
# never enabled in a build that ships.
ban-canary-lib = []
ban-canary-tests = []

[dev-dependencies]
# Self dev-dependency: switches `test-fakes` on for this crate's own tests
# (unit, integration and doc tests), so `tests/*.rs` can use the public fakes.
voicen-core = { path = ".", features = ["test-fakes"] }
# Mock OpenAI-compatible server for tests/openai_client.rs (T-040).
tokio = { version = "1", features = ["macros", "rt"] }
wiremock = "0.6"

# T-089 call bans (P-020): the two lints that read this package's lint config file (reqwest
# client types and get shortcuts outside engine::http; Instant::now / elapsed outside
# crate::clock and tests/common) at deny, for every target of this package. This level beats an
# allow or expect of `warnings`; check-core keeps -D warnings on top. Proven to bite by
# make check-ban-canary; every line naming the lint tool is an owned line (T-089 token guard).
# docs/decisions/ci-toolchain.md.
[lints.clippy]
disallowed_methods = "deny"
disallowed_types = "deny"
