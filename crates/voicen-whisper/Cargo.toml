[package]
name = "voicen-whisper"
description = "Built-in engine of Voicen: whisper.cpp through whisper-rs behind voicen-core's SpeechModelLoader"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

# The crate has no unit tests and no doctests: every test is an integration test in tests/*.rs,
# the only targets build.rs gives the shell's C runtime (rustc-link-arg-tests; T-099 invariant 4,
# docs/decisions/ci-toolchain.md). A lib test or doctest exe would link the dynamic VC runtime.
[lib]
test = false
doctest = false

# Exactly voicen-core and whisper-rs (default features: CPU only, no log backend) (T-099
# invariant 1; tests/transcribe_wav.rs::direct_dependencies_are_voicen_core_and_whisper_rs).
# The whisper.cpp build settings (CPU baseline, C runtime) live in .cargo/config.toml [env].
[dependencies]
voicen-core = { path = "../voicen-core" }
whisper-rs = "0.16"

[dev-dependencies]
# tests/transcribe_wav.rs: the speech-model port, the catalog and the ModelStore.
voicen-core = { path = "../voicen-core" }
# tests/transcribe_wav.rs: `cargo metadata` JSON of this package.
serde_json = "1"
# tests/transcribe_wav.rs: SHA-256 of the cached tiny model against the pinned catalog value.
sha2 = "0.10"
