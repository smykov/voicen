# T-202 (decisions #249, #253): the contour's dispatcher. It reads the task record on task/<ID>,
# picks the next stage and starts teamwright-agent.yml for it; after implement it starts the
# P-016 run of ci.yml on wip/<ID> (a push with the job token starts no run); at CODE_COMPLETE it
# opens the pull request of task/<ID> when that branch has commits not on the default branch.
# T-231: the owner's label `teamwright` on an open Issue titled "T-NNN: ..." starts the chain:
# the relay job start dispatches hop 0 of this file for that task. The header, line 1 to the job
# map, is the owned copy scripts/ci/contour-heads/teamwright-next.yml (make check,
# check-release-guard, R14). It runs no session and pushes nothing (docs/decisions/ci-toolchain.md).
name: teamwright next
run-name: "teamwright next ${{ inputs.task_id || format('label on Issue #{0}', github.event.issue.number) }} (hop ${{ inputs.hop || '0' }})"

on:
  # The label start (T-231); the relay job start turns it into a workflow_dispatch hop 0.
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      task_id:
        description: "Task, e.g. T-202"
        required: true
      hop:
        description: "Chain step of the stage that ended (0: start)"
        required: false
        default: "0"
      prev_stage:
        description: "The stage that ended (empty: start)"
        required: false
        default: ""
      prev_status:
        description: "Task status before that stage"
        required: false
        default: ""
      issue:
        description: "Issue for reports (empty: no reports)"
        required: false
        default: ""

# One dispatch of a task at a time: a group per task (decisions #292); the stage job has its own.
# A label run has no task id yet (an expression cannot parse the title): its group is per Issue,
# and the hop 0 it dispatches runs in the task's group, as a manual start does (T-231).
concurrency:
  group: teamwright-next-${{ inputs.task_id || format('issue-{0}', github.event.issue.number) }}
  cancel-in-progress: false

permissions:
  contents: read
  issues: write
  actions: write
  pull-requests: write
jobs:
  # T-231: the label relay. The owner's label `teamwright` on an open Issue becomes a
  # workflow_dispatch hop 0 of this file, so every hop of a task runs in teamwright-next-<ID>. The
  # condition is decided before a runner is taken: a label by anyone else never reaches it.
  start:
    if: github.event_name == 'issues' && github.event.label.name == 'teamwright' && github.event.issue.state == 'open' && github.actor == github.repository_owner
    runs-on: [self-hosted, Linux, X64, claude]
    timeout-minutes: 5
    env:
      # The title is untrusted text: an env value only, reduced to its task id by the parser.
      TITLE: ${{ github.event.issue.title }}
      ISSUE: ${{ github.event.issue.number }}
      REPO: ${{ github.repository }}
      MAIN: ${{ github.event.repository.default_branch }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5

      - name: Start the chain of the labelled Issue
        shell: bash {0}
        run: |
          set -uo pipefail
          [[ "$ISSUE" =~ ^[0-9]+$ ]] || { echo "::error::bad issue number"; exit 1; }
          verdict="$(scripts/ci/contour-label.sh "$TITLE")"
          case "$verdict" in
            "start "*)
              id="${verdict#start }"
              gh workflow run teamwright-next.yml -R "$REPO" --ref "$MAIN" -f task_id="$id" -f issue="$ISSUE" -f hop=0 || { echo "::error::hop 0 of $id was not dispatched"; exit 1; }
              echo "Issue #$ISSUE: hop 0 of $id dispatched." >> "$GITHUB_STEP_SUMMARY" ;;
            "bad "*)
              msg="No contour chain started: ${verdict#bad }. Rename the Issue to \"T-NNN: <title>\" and add the label again. $RUN_URL"
              echo "$msg" >> "$GITHUB_STEP_SUMMARY"
              gh issue comment "$ISSUE" -R "$REPO" --body "$msg" >/dev/null || echo "::warning::no comment on Issue #$ISSUE"
              exit 0 ;;
            *) echo "::error::scripts/ci/contour-label.sh gave no verdict"; exit 1 ;;
          esac

  next:
    if: github.event_name == 'workflow_dispatch' && (github.actor == github.repository_owner || github.actor == 'github-actions[bot]')
    runs-on: [self-hosted, Linux, X64, claude]
    timeout-minutes: 15
    env:
      TASK_ID: ${{ inputs.task_id }}
      HOP: ${{ inputs.hop }}
      PREV_STAGE: ${{ inputs.prev_stage }}
      PREV_STATUS: ${{ inputs.prev_status }}
      ISSUE: ${{ inputs.issue }}
      REPO: ${{ github.repository }}
      MAIN: ${{ github.event.repository.default_branch }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      GH_TOKEN: ${{ github.token }}
      # Stages of one chain at most; the stop when nothing moved comes first.
      MAX_HOPS: "12"
      # Tasks with an unfinished stage at once, at most (decisions #292, #296): 5. The one place of
      # the limit (docs/decisions/ci-toolchain.md); the count is scripts/ci/contour-busy.sh.
      MAX_PARALLEL: "5"
      MODEL: opus
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Next stage
        shell: bash {0}
        env:
          AUTH_VAR: ${{ vars.TEAMWRIGHT_AUTH }}
          # The owner's pause (decisions #288): non-empty when this job started = no dispatch.
          TEAMWRIGHT_CONTOUR_PAUSE: ${{ vars.TEAMWRIGHT_CONTOUR_PAUSE }}
        run: |
          set -uo pipefail
          say() {
            echo "$1" >> "$GITHUB_STEP_SUMMARY"
            [ -z "$ISSUE" ] || gh issue comment "$ISSUE" -R "$REPO" --body "$1" >/dev/null || echo "::warning::no comment on Issue #$ISSUE"
          }
          [ "${AUTH_VAR:-}" = subscription ] || { echo "::error::repository variable TEAMWRIGHT_AUTH is not 'subscription'"; exit 1; }
          [[ "$TASK_ID" =~ ^T-[0-9]{3,}$ ]] || { echo "::error::task_id must look like T-202"; exit 1; }
          [[ "$HOP" =~ ^[0-9]+$ ]] || { echo "::error::bad hop"; exit 1; }
          [[ "$ISSUE" =~ ^[0-9]*$ ]] || { echo "::error::bad issue number"; exit 1; }
          case "$PREV_STAGE" in "" | analyze | red-tests | implement | review) ;; *) echo "::error::bad prev_stage"; exit 1 ;; esac
          if [ -n "${TEAMWRIGHT_CONTOUR_PAUSE:-}" ]; then
            say "**$TASK_ID**: chain stopped: the contour is paused (repository variable TEAMWRIGHT_CONTOUR_PAUSE); no stage, ci.yml run or pull request was started. $RUN_URL"
            exit 0
          fi

          # Up to MAX_PARALLEL tasks at a time: scripts/ci/contour-busy.sh counts the other tasks with
          # an unfinished stage (full: this dispatch starts nothing and says so); the stage of this
          # task that started it may still be ending (own: wait, up to 3 minutes). At hop 0 (a label
          # or a manual start) an own stage means the chain is running: this start does nothing.
          for i in $(seq 1 18); do
            busy="$(gh run list -R "$REPO" --workflow teamwright-agent.yml --limit 50 --json status,displayTitle | scripts/ci/contour-busy.sh "$TASK_ID" "$MAX_PARALLEL")" || { say "**$TASK_ID**: the stage runs were not counted (gh run list or scripts/ci/contour-busy.sh failed). $RUN_URL"; exit 1; }
            case "$busy" in
              own)
                if [ "$HOP" = 0 ] && [ -z "$PREV_STAGE" ]; then
                  say "**$TASK_ID**: a chain of $TASK_ID is already running; this start does nothing. $RUN_URL"; exit 0
                fi
                sleep 10 ;;
              "full "*) say "**$TASK_ID**: chain stopped: ${busy#full } other tasks have unfinished stages (the limit is $MAX_PARALLEL, MAX_PARALLEL in teamwright-next.yml); start teamwright-next.yml for $TASK_ID again when one ends. $RUN_URL"; exit 0 ;;
              "free "*) break ;;
              *) say "**$TASK_ID**: the stage runs were not counted (no verdict). $RUN_URL"; exit 1 ;;
            esac
          done
          [ "$busy" != own ] || { say "**$TASK_ID**: chain stopped: its previous stage did not end. $RUN_URL"; exit 1; }

          ref="origin/$MAIN"
          if git ls-remote --exit-code --heads origin "task/$TASK_ID" >/dev/null; then
            git fetch -q origin "task/$TASK_ID" && ref=FETCH_HEAD
          fi
          rec="$(git show "$ref:docs/tasks/$TASK_ID.md")" || { say "**$TASK_ID**: no task record. $RUN_URL"; exit 1; }
          status="$(sed -n 's/^status:[[:space:]]*//p' <<<"$rec" | head -n 1)"
          recstage="$(sed -n 's/^stage:[[:space:]]*//p' <<<"$rec" | head -n 1)"

          # The P-016 run of the implemented code: a push with the job token starts no run.
          if [ "$PREV_STAGE" = implement ]; then
            gh workflow run ci.yml -R "$REPO" --ref "wip/$TASK_ID" || say "**$TASK_ID**: the ci.yml run of wip/$TASK_ID was not started. $RUN_URL"
          fi

          case "$status" in
            TODO | ANALYSIS | VERIFY_FAIL) next=analyze ;;
            IN_PROGRESS)
              case "$recstage" in red-tests | implement) next="$recstage" ;; *) next=red-tests ;; esac ;;
            NEEDS_REVIEW) next=review ;;
            CODE_COMPLETE | VERIFIED | DONE)
              # Nothing to merge (no task/<ID>, or no commit on it that is not on the default branch):
              # git answers, the chain ends without a ci.yml run or a pull request (T-231).
              ahead=0
              if [ "$ref" = FETCH_HEAD ]; then
                ahead="$(git rev-list --count "origin/$MAIN..FETCH_HEAD")" || ahead=0
              fi
              [[ "$ahead" =~ ^[0-9]+$ ]] || ahead=0
              if [ "$ahead" = 0 ]; then
                say "**$TASK_ID**: $status, nothing to merge from task/$TASK_ID; the chain ends, verify locally (/teamwright:verify $TASK_ID). $RUN_URL"
                exit 0
              fi
              gh workflow run ci.yml -R "$REPO" --ref "task/$TASK_ID" || true
              pr="$(gh pr create -R "$REPO" --base "$MAIN" --head "task/$TASK_ID" --title "$TASK_ID" --body "Contour run of $TASK_ID, status $status. $RUN_URL" 2>&1)" || pr="no pull request: $pr"
              say "**$TASK_ID**: $status, the chain ends. $pr"
              exit 0 ;;
            *) say "**$TASK_ID**: chain stopped at status $status (the owner decides). $RUN_URL"; exit 0 ;;
          esac

          if [ -n "$PREV_STAGE" ] && [ "$next" = "$PREV_STAGE" ] && [ "$status" = "$PREV_STATUS" ]; then
            say "**$TASK_ID**: chain stopped: stage $PREV_STAGE moved nothing (status $status). $RUN_URL"
            exit 0
          fi
          hop=$((HOP + 1))
          if [ "$hop" -gt "$MAX_HOPS" ]; then
            say "**$TASK_ID**: chain stopped at the hop limit $MAX_HOPS (status $status). $RUN_URL"
            exit 0
          fi
          gh workflow run teamwright-agent.yml -R "$REPO" --ref "$MAIN" -f task_id="$TASK_ID" -f stage="$next" -f model="$MODEL" -f hop="$hop" -f issue="$ISSUE" || { say "**$TASK_ID**: stage $next was not started. $RUN_URL"; exit 1; }
          say "**$TASK_ID**: status $status, stage $next started (hop $hop)."
