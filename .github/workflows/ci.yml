name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  gate:
    name: Gate (make check)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: "20.19"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Build the core toolchain image
        run: make core-image
      # Cargo registry of scripts/tw-run core (config.yml cache /usr/local/cargo/registry,
      # mounted from .teamwright/cache/core/_usr_local_cargo_registry). index + cache hold
      # the downloaded .crate files; cargo re-extracts src offline. Saves the crates.io
      # download of the license check (T-027, decision #24 D3).
      - name: Cache the cargo registry of the core image
        uses: actions/cache@v6
        with:
          path: |
            .teamwright/cache/core/_usr_local_cargo_registry/index
            .teamwright/cache/core/_usr_local_cargo_registry/cache
          key: cargo-registry-core-${{ hashFiles('Cargo.lock', 'licenses/fixtures/gpl/Cargo.lock') }}
          restore-keys: cargo-registry-core-
      - run: make check

  windows:
    name: Windows build, install and smoke test
    needs: gate
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: "20.19"
          cache: pnpm
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.0"
      - uses: Swatinem/rust-cache@v2
      - name: Commit of this build
        shell: bash
        run: echo "VOICEN_COMMIT=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_ENV"
      - run: pnpm install --frozen-lockfile
      # The shell's build script (tauri-build static VC runtime) puts a stub msvcrt.lib on its
      # search path; cargo gives every build script's search dirs (native_dirs) to every doctest
      # of the same invocation, so other crates' doctests must not share a run with `voicen` (T-033, F-001).
      - run: cargo test --workspace --exclude voicen
      - run: cargo test -p voicen
      - run: pnpm tauri build
      - name: Install silently, launch, check the start log line, the first-run settings.json and the Run value
        shell: pwsh
        run: |
          $setup = Get-ChildItem target/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          Start-Process $setup.FullName -ArgumentList '/S' -Wait
          $exe = Join-Path $env:LOCALAPPDATA 'Voicen\voicen.exe'
          $uninstaller = Join-Path $env:LOCALAPPDATA 'Voicen\uninstall.exe'
          $shortcut = Join-Path $env:APPDATA 'Microsoft\Windows\Start Menu\Programs\Voicen.lnk'
          $missing = @()
          foreach ($p in @(@('voicen.exe', $exe), @('uninstall.exe', $uninstaller), @('Voicen.lnk', $shortcut))) {
            if (Test-Path -LiteralPath $p[1] -PathType Leaf) { Write-Output "found $($p[0]) at $($p[1])" }
            else { $missing += "$($p[0]) not found at $($p[1])" }
          }
          if ($missing) { throw ($missing -join '; ') }
          # T-014: a leftover Run value (e.g. from an older install) must be removed by the
          # reconcile at first launch, whose defaults say start_with_windows = off.
          $run = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Run'
          New-ItemProperty -Path $run -Name 'Voicen' -PropertyType String -Value '"C:\stale\voicen.exe" --autostart' -Force | Out-Null
          $proc = Start-Process -FilePath $exe -PassThru
          $log = Join-Path $env:LOCALAPPDATA 'Voicen\logs\voicen.log'
          # First launch writes the defaults through SettingsService (T-030, decision #34).
          $settings = Join-Path $env:LOCALAPPDATA 'Voicen\settings.json'
          $expected = "($env:VOICEN_COMMIT) started"
          $found = $false
          $hasSettings = $false
          $runGone = $false
          for ($i = 0; $i -lt 30 -and -not ($found -and $hasSettings -and $runGone); $i++) {
            Start-Sleep -Seconds 1
            $found = (Test-Path $log) -and (Select-String -Path $log -SimpleMatch $expected -Quiet)
            $hasSettings = Test-Path -LiteralPath $settings -PathType Leaf
            $runGone = $null -eq (Get-ItemProperty -Path $run -Name 'Voicen' -ErrorAction SilentlyContinue)
          }
          Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
          if (-not $found) { if (Test-Path $log) { Get-Content $log }; throw "start log line with commit $env:VOICEN_COMMIT not found" }
          Get-Content $log
          if (-not $hasSettings) { throw "settings.json not found at $settings after the first launch" }
          $engine = (Get-Content -LiteralPath $settings -Raw | ConvertFrom-Json).engine
          if ($engine -ne 'none') { throw "first-run settings.json has engine '$engine', expected 'none'" }
          Write-Output "found settings.json at $settings with engine = none"
          if (-not $runGone) { throw "the leftover HKCU Run value Voicen is still present after the first launch (start_with_windows off)" }
          Write-Output "no HKCU Run value Voicen after the first launch"
      - name: Start with Windows on writes the Run value, off removes it (T-014 reconcile at start)
        shell: pwsh
        run: |
          $exe = Join-Path $env:LOCALAPPDATA 'Voicen\voicen.exe'
          $settings = Join-Path $env:LOCALAPPDATA 'Voicen\settings.json'
          $run = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Run'
          $expected = '"' + $exe + '" --autostart'
          function Set-StartWithWindows([string]$from, [string]$to) {
            $text = [System.IO.File]::ReadAllText($settings)
            $next = $text -replace ('"start_with_windows":\s*' + $from), ('"start_with_windows": ' + $to)
            if ($next -eq $text) { throw "settings.json has no start_with_windows = $from" }
            [System.IO.File]::WriteAllText($settings, $next)
          }
          function Get-RunValue { (Get-ItemProperty -Path $run -Name 'Voicen' -ErrorAction SilentlyContinue).Voicen }
          # On: launched as the Run value would launch it; reconcile writes the current command.
          Set-StartWithWindows 'false' 'true'
          $proc = Start-Process -FilePath $exe -ArgumentList '--autostart' -PassThru
          $value = $null
          for ($i = 0; $i -lt 30 -and $value -ne $expected; $i++) { Start-Sleep -Seconds 1; $value = Get-RunValue }
          Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
          if ($value -ne $expected) { throw "HKCU Run value Voicen is '$value', expected '$expected'" }
          Write-Output "HKCU Run value Voicen = $value"
          # Off again: reconcile removes it.
          Set-StartWithWindows 'true' 'false'
          $proc = Start-Process -FilePath $exe -PassThru
          $value = Get-RunValue
          for ($i = 0; $i -lt 30 -and $null -ne $value; $i++) { Start-Sleep -Seconds 1; $value = Get-RunValue }
          Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
          if ($null -ne $value) { throw "HKCU Run value Voicen still present ('$value') with start_with_windows off" }
          Write-Output "no HKCU Run value Voicen with start_with_windows off"
      - uses: actions/upload-artifact@v4
        with:
          name: voicen-installer-${{ env.VOICEN_COMMIT }}
          path: target/release/bundle/nsis/*-setup.exe
