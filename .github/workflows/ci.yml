name: CI

on:
  # wip/** (T-066, P-016, decisions #90): the orchestrator's CI-only push of a task's head
  # (git push origin HEAD:wip/<ID>; pre-push: not a delivery) runs this whole workflow before
  # review, so a premise only CI can run is never first run on main. Pinned by make check
  # (check-ci-wip).
  push:
    branches: [main, "wip/**"]
    tags: ["v*"]
  pull_request:

# A newer push to the same wip/<ID> cancels the run of the older head (P-016 counts only the
# reviewed head). Other refs (main, tags, pull requests) get a group per run: a shared group
# would make a newer main push wait for the running one and cancel a pending one, so a
# delivered commit could have no run of its own.
concurrency:
  group: ${{ startsWith(github.ref, 'refs/heads/wip/') && format('ci-{0}', github.ref) || format('ci-run-{0}', github.run_id) }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/heads/wip/') }}

jobs:
  gate:
    name: Gate (make check)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      # The ui area runs in its toolchain image, the official Playwright image at the
      # lockfile's @playwright/test version plus pnpm (docker/ui.Dockerfile), as locally: the
      # install, lint, unit tests, licenses and the e2e run (its browser in a network namespace
      # of its own, --network none; T-064, decision #89). The e2e entry passes CI through.
      # Host node only for the host-side fixture tests (scripts/ci/e2e-entry.test.sh); no ui
      # command runs on it. package-manager-cache: false because setup-node v5 otherwise
      # auto-caches the package.json packageManager (pnpm) and runs `pnpm store path` on the
      # host; this job has no host pnpm since T-064 (decision #89). Pinned by make check
      # (check-setup-node-cache, T-068).
      - uses: actions/setup-node@v5
        with:
          node-version: "20.19"
          package-manager-cache: false
      - name: Build the ui toolchain image
        run: make ui-image
      - run: scripts/tw-run ui -- pnpm install --frozen-lockfile
      - name: Build the core toolchain image
        run: make core-image
      # Cargo registry of scripts/tw-run core (config.yml cache /usr/local/cargo/registry,
      # mounted from .teamwright/cache/core/_usr_local_cargo_registry). index + cache hold
      # the downloaded .crate files; cargo re-extracts src offline. Saves the crates.io
      # download of the license check (T-027, decision #24 D3). Restored on every ref, saved from
      # main only (T-066): the repo cache is at its 10 GB limit (T-058), and entries saved from
      # wip/** runs would evict main's. actions/cache saves in its post step on every ref, so
      # restore and save are separate steps; make check (check-ci-wip) refuses a save that is
      # not limited to main.
      - name: Restore the cargo registry of the core image
        id: cargo-registry
        uses: actions/cache/restore@v6
        with:
          path: |
            .teamwright/cache/core/_usr_local_cargo_registry/index
            .teamwright/cache/core/_usr_local_cargo_registry/cache
          key: cargo-registry-core-${{ hashFiles('Cargo.lock', 'licenses/fixtures/gpl/Cargo.lock') }}
          restore-keys: cargo-registry-core-
      - run: make check
      # After a green make check, as the post step of actions/cache did; not on an exact hit
      # (the entry exists).
      - name: Save the cargo registry of the core image (main only)
        if: ${{ github.ref == 'refs/heads/main' && steps.cargo-registry.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: |
            .teamwright/cache/core/_usr_local_cargo_registry/index
            .teamwright/cache/core/_usr_local_cargo_registry/cache
          key: ${{ steps.cargo-registry.outputs.cache-primary-key }}

  windows:
    name: Windows build, install and smoke test
    needs: gate
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      # No cache in setup-node: its post step saves on every ref and has no switch to limit it
      # to main (setup-node v5 action.yml), so the pnpm store is restored here on every ref and
      # saved after pnpm install from main only (T-066; make check: check-ci-wip).
      - uses: actions/setup-node@v5
        with:
          node-version: "20.19"
          package-manager-cache: false
      - name: Path of the pnpm store
        id: pnpm-store
        shell: bash
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - name: Restore the pnpm store
        id: pnpm-cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.0"
      # save-if: restored on every ref, saved from main only (T-066, the cache limit above).
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Commit of this build
        shell: bash
        run: echo "VOICEN_COMMIT=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_ENV"
      - run: pnpm install --frozen-lockfile
      - name: Save the pnpm store (main only)
        if: ${{ github.ref == 'refs/heads/main' && steps.pnpm-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ steps.pnpm-cache.outputs.cache-primary-key }}
      # T-077 (decisions #98): one version per run, written before the first compile into
      # Cargo.toml, tauri.conf.json, package.json and the two workspace members of Cargo.lock
      # (never committed): <repo MAJOR.MINOR>.<run_number>, a vX.Y.Z tag build X.Y.Z. A bad tag,
      # repo version or run number stops the job here. Exports VOICEN_VERSION. Contract and host
      # test: scripts/ci/version-stamp.sh, version-stamp.test.sh (make check).
      - name: Version of this build
        shell: bash
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          RUN_NUMBER: ${{ github.run_number }}
        run: scripts/ci/version-stamp.sh "$REF_TYPE" "$REF_NAME" "$RUN_NUMBER"
      # The shell's build script (tauri-build static VC runtime) puts a stub msvcrt.lib on its
      # search path; cargo gives every build script's search dirs (native_dirs) to every doctest
      # of the same invocation, so other crates' doctests must not share a run with `voicen` (T-033, F-001).
      # --no-fail-fast: one red test binary must not hide the others; the step still fails at the end (T-048, T-044).
      - run: cargo test --workspace --exclude voicen --no-fail-fast
      - run: cargo test -p voicen --no-fail-fast
      - run: pnpm tauri build
      - name: Install silently, launch, check the start, settings-load and reconcile log lines, the first-run settings.json, the Run value and the settings window
        shell: pwsh
        run: |
          . ./scripts/ci/visible-windows.ps1
          $setup = Get-ChildItem target/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          Start-Process $setup.FullName -ArgumentList '/S' -Wait
          $exe = Join-Path $env:LOCALAPPDATA 'Voicen\voicen.exe'
          $uninstaller = Join-Path $env:LOCALAPPDATA 'Voicen\uninstall.exe'
          $shortcut = Join-Path $env:APPDATA 'Microsoft\Windows\Start Menu\Programs\Voicen.lnk'
          $missing = @()
          foreach ($p in @(@('voicen.exe', $exe), @('uninstall.exe', $uninstaller), @('Voicen.lnk', $shortcut))) {
            if (Test-Path -LiteralPath $p[1] -PathType Leaf) { Write-Output "found $($p[0]) at $($p[1])" }
            else { $missing += "$($p[0]) not found at $($p[1])" }
          }
          if ($missing) { throw ($missing -join '; ') }
          # T-025 (NFR-09, spec 006 FR-019): the installed size is measured before the first
          # launch (no settings, logs or WebView2 data yet) and is at most 100 MB (binary units,
          # OQ-08); the committed THIRD-PARTY-NOTICES.txt (T-027) is installed next to voicen.exe
          # byte for byte (bundle.resources map form).
          $installDir = Join-Path $env:LOCALAPPDATA 'Voicen'
          $installed = @(Get-ChildItem -LiteralPath $installDir -Recurse -File -Force)
          $size = ($installed | Measure-Object -Property Length -Sum).Sum
          $limit = 100 * 1024 * 1024
          Write-Output "installed size before the first launch: $size bytes in $($installed.Count) files (limit $limit)"
          if ($size -gt $limit) { throw "installed size $size bytes exceeds $limit bytes (100 MB, NFR-09)" }
          $notices = Join-Path $installDir 'THIRD-PARTY-NOTICES.txt'
          if (-not (Test-Path -LiteralPath $notices -PathType Leaf)) { throw "THIRD-PARTY-NOTICES.txt not found at $notices after the silent install (installed files: $(($installed | ForEach-Object { $_.Name }) -join ', '))" }
          $want = (Get-FileHash -LiteralPath 'THIRD-PARTY-NOTICES.txt' -Algorithm SHA256).Hash
          $got = (Get-FileHash -LiteralPath $notices -Algorithm SHA256).Hash
          if ($got -ne $want) { throw "the installed THIRD-PARTY-NOTICES.txt (SHA256 $got) differs from the committed one (SHA256 $want)" }
          Write-Output "found THIRD-PARTY-NOTICES.txt at $notices, equal to the committed file"
          # T-014: a leftover Run value (e.g. from an older install) must be removed by the
          # reconcile at first launch, whose defaults say start_with_windows = off.
          $run = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Run'
          New-ItemProperty -Path $run -Name 'Voicen' -PropertyType String -Value '"C:\stale\voicen.exe" --autostart' -Force | Out-Null
          $proc = Start-Process -FilePath $exe -PassThru
          # T-052: keeps ExitCode readable once the process has exited.
          $null = $proc.Handle
          # T-008: voicen.log plus any rolled voicen-*.log (a run crossing local midnight
          # rolls the file). The app keeps voicen.log open; Select-String and Get-Content
          # read it with shared access.
          $logs = Join-Path $env:LOCALAPPDATA 'Voicen\logs\voicen*.log'
          function Test-LogLine([string]$text) { (Test-Path $logs) -and (@(Select-String -Path $logs -SimpleMatch $text).Count -gt 0) }
          # First launch writes the defaults through SettingsService (T-030, decision #34).
          $settings = Join-Path $env:LOCALAPPDATA 'Voicen\settings.json'
          # T-077: the installed exe reports the stamped version (CARGO_PKG_VERSION) in its start line.
          $expected = "voicen $env:VOICEN_VERSION ($env:VOICEN_COMMIT) started"
          # T-008 (spec 004 R-11): load_settings logs the load outcome, then the reconcile
          # action; a first run with the leftover Run value is first_run, then removed.
          $loadLine = 'settings load outcome=first_run'
          $reconcileLine = 'autostart reconcile action=removed'
          $found = $false
          $loaded = $false
          $reconciled = $false
          $hasSettings = $false
          $runGone = $false
          # T-037 (S1): FirstRun opens the settings window: exactly one shown window, titled
          # Voicen. Shown = visible, unowned, top-level and not a framework helper window (tool
          # windows count, T-057). A helper is excluded only by a visible-helper class of the
          # manifest scripts/ci/helper-windows.txt AND all four helper ex-style bits; the listed
          # helpers have WS_VISIBLE set, so Process.MainWindowHandle cannot tell
          # (scripts/ci/visible-windows.ps1).
          $win = $false
          $seen = 'no process'
          for ($i = 0; $i -lt 30 -and -not ($found -and $loaded -and $reconciled -and $hasSettings -and $runGone -and $win); $i++) {
            Start-Sleep -Seconds 1
            $found = Test-LogLine $expected
            $loaded = Test-LogLine $loadLine
            $reconciled = Test-LogLine $reconcileLine
            $hasSettings = Test-Path -LiteralPath $settings -PathType Leaf
            $runGone = $null -eq (Get-ItemProperty -Path $run -Name 'Voicen' -ErrorAction SilentlyContinue)
            if ($proc.HasExited) { $seen = 'process exited'; $win = $false; continue }
            $shown = Get-ShownWindows $proc.Id
            $seen = Format-ShownWindows $shown
            $win = $shown.Count -eq 1 -and $shown[0].Title -ceq 'Voicen'
          }
          # T-065 census: the manifest's visible-helper verdicts against this voicen.exe, both
          # ways (an unlisted helper-shaped window, a listed visible helper that is absent).
          # Bounded retry: a helper created after the settings window gets a few seconds.
          # A census skipped because the process had exited says so; it never reads as "no drift"
          # (the step still fails later on the window count or the close check).
          $drift = @()
          $census = 'not run (the process exited before the census)'
          if (-not $proc.HasExited) {
            $census = 'ran'
            for ($i = 0; $i -lt 10; $i++) {
              $drift = @(Get-HelperDrift $proc.Id)
              if ($drift.Count -eq 0 -or $proc.HasExited) { break }
              Start-Sleep -Seconds 1
            }
          }
          # T-052: run() builds the tray (tray-icon's hidden 'tray_icon_app' window of this process),
          # and closing the first-run window keeps the app running (prevent_exit for
          # ExitRequested { code: None } while the tray exists; the #38 interim ends). Raw facts only
          # (F-003): window class, HasExited, the shown windows.
          $tray = $false
          $traySeen = 'not checked (no first-run window)'
          $closedAlive = $false
          $closeSeen = 'not tried (no first-run window)'
          if ($win -and -not $proc.HasExited) {
            for ($i = 0; $i -lt 30 -and -not $tray; $i++) {
              $all = Get-AllWindows $proc.Id
              $traySeen = Format-AllWindows $all
              $tray = @($all | Where-Object { $_.Class -ceq 'tray_icon_app' }).Count -ge 1
              if (-not $tray) { Start-Sleep -Seconds 1 }
            }
            Send-Close $shown[0].Handle
            # Bounded: the process must stay for 10 s, and the window must be gone by then.
            $closedAlive = $true
            $gone = $false
            for ($i = 0; $i -lt 10; $i++) {
              Start-Sleep -Seconds 1
              if ($proc.HasExited) { $closedAlive = $false; $closeSeen = "process exited (code $($proc.ExitCode))"; break }
              $left = Get-ShownWindows $proc.Id
              $gone = $left.Count -eq 0
              $closeSeen = "alive, shown windows: $(Format-ShownWindows $left)"
            }
            if ($closedAlive -and -not $gone) { $closedAlive = $false; $closeSeen = "the settings window did not close ($closeSeen)" }
          }
          Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
          if (-not $found) { if (Test-Path $logs) { Get-Content $logs }; throw "start log line '$expected' (version $env:VOICEN_VERSION, commit $env:VOICEN_COMMIT) not found" }
          Get-Content $logs
          if (-not $loaded) { throw "log line '$loadLine' not found after the first launch" }
          if (-not $reconciled) { throw "log line '$reconcileLine' not found after the first launch" }
          Write-Output "found the start, '$loadLine' and '$reconcileLine' log lines"
          if (-not $hasSettings) { throw "settings.json not found at $settings after the first launch" }
          $engine = (Get-Content -LiteralPath $settings -Raw | ConvertFrom-Json).engine
          if ($engine -ne 'none') { throw "first-run settings.json has engine '$engine', expected 'none'" }
          Write-Output "found settings.json at $settings with engine = none"
          if (-not $runGone) { throw "the leftover HKCU Run value Voicen is still present after the first launch (start_with_windows off)" }
          Write-Output "no HKCU Run value Voicen after the first launch"
          # Before the window count: an unlisted helper also makes that count fail, and this
          # names the cause (scripts/ci/helper-windows.txt, docs/decisions/overlay.md §5).
          if ($drift.Count -gt 0) { throw "first launch: $(Format-HelperDrift $drift)" }
          if ($census -ceq 'ran') { Write-Output "no helper list drift after the first launch" }
          else { Write-Output "helper list census after the first launch: $census" }
          if (-not $win) { throw "not exactly one shown window titled Voicen after the first launch (last seen: $seen)" }
          Write-Output "exactly one shown window after the first launch: $seen"
          if (-not $tray) { throw "no 'tray_icon_app' window of voicen.exe after the first launch (windows: $traySeen)" }
          Write-Output "found the tray window after the first launch"
          if (-not $closedAlive) { throw "closing the first-run settings window did not leave the app running with no shown window: $closeSeen" }
          Write-Output "WM_CLOSE to the first-run settings window: $closeSeen, for 10 s"
      - name: Start with Windows on writes the Run value, off removes it (T-014 reconcile at start)
        shell: pwsh
        run: |
          $exe = Join-Path $env:LOCALAPPDATA 'Voicen\voicen.exe'
          $settings = Join-Path $env:LOCALAPPDATA 'Voicen\settings.json'
          $run = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Run'
          $expected = '"' + $exe + '" --autostart'
          function Set-StartWithWindows([string]$from, [string]$to) {
            $text = [System.IO.File]::ReadAllText($settings)
            $next = $text -replace ('"start_with_windows":\s*' + $from), ('"start_with_windows": ' + $to)
            if ($next -eq $text) { throw "settings.json has no start_with_windows = $from" }
            [System.IO.File]::WriteAllText($settings, $next)
          }
          function Get-RunValue { (Get-ItemProperty -Path $run -Name 'Voicen' -ErrorAction SilentlyContinue).Voicen }
          # On: launched as the Run value would launch it; reconcile writes the current command.
          Set-StartWithWindows 'false' 'true'
          $proc = Start-Process -FilePath $exe -ArgumentList '--autostart' -PassThru
          $value = $null
          for ($i = 0; $i -lt 30 -and $value -ne $expected; $i++) { Start-Sleep -Seconds 1; $value = Get-RunValue }
          Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
          if ($value -ne $expected) { throw "HKCU Run value Voicen is '$value', expected '$expected'" }
          Write-Output "HKCU Run value Voicen = $value"
          # Off again: reconcile removes it.
          Set-StartWithWindows 'true' 'false'
          $proc = Start-Process -FilePath $exe -PassThru
          $value = Get-RunValue
          for ($i = 0; $i -lt 30 -and $null -ne $value; $i++) { Start-Sleep -Seconds 1; $value = Get-RunValue }
          Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
          if ($null -ne $value) { throw "HKCU Run value Voicen still present ('$value') with start_with_windows off" }
          Write-Output "no HKCU Run value Voicen with start_with_windows off"
      # T-034: the same predicate for both ways a loaded start happens: a plain launch and the
      # logon launch the HKCU Run value makes ("<exe>" --autostart, FR-19, spec 004 US5-3). Each
      # launch shows zero windows for 10 s after its start line and has the tray
      # ('tray_icon_app', the class the first launch checks). The settings file is left as the
      # previous step left it (start_with_windows off), so no Run value outlives this step.
      - name: A launch with a loaded settings.json, with or without --autostart, shows no window and has the tray (T-037 startup executor, T-034)
        shell: pwsh
        run: |
          . ./scripts/ci/visible-windows.ps1
          $exe = Join-Path $env:LOCALAPPDATA 'Voicen\voicen.exe'
          $settings = Join-Path $env:LOCALAPPDATA 'Voicen\settings.json'
          # voicen.log plus rolled voicen-*.log: a run crossing local midnight rolls the file (T-008).
          $log = Join-Path $env:LOCALAPPDATA 'Voicen\logs\voicen*.log'
          $expected = "($env:VOICEN_COMMIT) started"
          if (-not (Test-Path -LiteralPath $settings -PathType Leaf)) { throw "settings.json not found at $settings before the loaded launch" }
          function Get-StartCount { if (Test-Path $log) { @(Select-String -Path $log -SimpleMatch $expected).Count } else { 0 } }
          # '' is the plain launch; Start-Process refuses an empty -ArgumentList, so the argument
          # is splatted only when there is one.
          foreach ($flag in @('', '--autostart')) {
            $what = if ($flag) { "loaded launch with $flag" } else { 'loaded launch without arguments' }
            $start = @{ FilePath = $exe; PassThru = $true }
            if ($flag) { $start.ArgumentList = @($flag) }
            $before = Get-StartCount
            $proc = Start-Process @start
            # Wait for this launch's start line (written before the load), then sample for a
            # fixed 10 s: a bounded negative, it can miss a window slower than that, never
            # report one that is not there.
            $started = $false
            for ($i = 0; $i -lt 30 -and -not $started; $i++) { Start-Sleep -Seconds 1; $started = (Get-StartCount) -gt $before }
            if (-not $started) { Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue; throw "$($what): start log line with commit $env:VOICEN_COMMIT not written" }
            # Same predicate as the first launch (scripts/ci/visible-windows.ps1): zero shown windows.
            $shown = $null
            for ($i = 0; $i -lt 10 -and -not $shown; $i++) {
              Start-Sleep -Seconds 1
              if ($proc.HasExited) { throw "voicen.exe exited during the $what (expected it to keep running with no window)" }
              $windows = Get-ShownWindows $proc.Id
              if ($windows.Count -gt 0) { $shown = Format-ShownWindows $windows }
            }
            # The tray: run() builds it on every start (T-052), so a start with no window is
            # still reachable. Raw facts only (F-003): the window classes of this process.
            $tray = $false
            $traySeen = ''
            for ($i = 0; $i -lt 30 -and -not $tray; $i++) {
              if ($proc.HasExited) { throw "voicen.exe exited during the $what (expected it to keep running with the tray)" }
              $all = Get-AllWindows $proc.Id
              $traySeen = Format-AllWindows $all
              $tray = @($all | Where-Object { $_.Class -ceq 'tray_icon_app' }).Count -ge 1
              if (-not $tray) { Start-Sleep -Seconds 1 }
            }
            # T-065 census, as in the first launch: the manifest's visible-helper verdicts against
            # this voicen.exe, both ways, before the shown-window count.
            $drift = @()
            for ($i = 0; $i -lt 10; $i++) {
              if ($proc.HasExited) { throw "voicen.exe exited during the $what (expected it to keep running with no window)" }
              $drift = @(Get-HelperDrift $proc.Id)
              if ($drift.Count -eq 0) { break }
              Start-Sleep -Seconds 1
            }
            Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
            $null = $proc.WaitForExit(30000)
            if ($drift.Count -gt 0) { throw "$($what): $(Format-HelperDrift $drift)" }
            Write-Output "no helper list drift on the $what"
            if ($shown) { throw "a window is shown on the $what of a loaded settings.json ($shown)" }
            Write-Output "no shown window for 10 s after the start line of the $what"
            if (-not $tray) { throw "no 'tray_icon_app' window of voicen.exe on the $what (windows: $traySeen)" }
            Write-Output "found the tray window on the $what"
          }
      # T-006 red-test row 24: run() starts the hotkey thread. Decided on the raw Win32 result of this
      # step's own RegisterHotKey of the settings' default hotkey (Ctrl+Alt+Space, MOD_NOREPEAT; F-003):
      # free before the launch, refused with 1409 (ERROR_HOTKEY_ALREADY_REGISTERED) while the app runs,
      # free again after it was stopped. Every wait polls against a Windows-sized budget (F-005).
      - name: The running app holds the dictation hotkey, and frees it when it ends (T-006 run() wiring)
        shell: pwsh
        run: |
          Add-Type -Namespace T006 -Name Hotkey -MemberDefinition @'
          [DllImport("user32.dll", SetLastError = true)] public static extern bool RegisterHotKey(IntPtr hWnd, int id, uint fsModifiers, uint vk);
          [DllImport("user32.dll", SetLastError = true)] public static extern bool UnregisterHotKey(IntPtr hWnd, int id);
          '@
          # 0 when this thread could register Ctrl+Alt+Space (then it is freed at once), else the Win32 error.
          function Test-Hotkey {
            if ([T006.Hotkey]::RegisterHotKey([IntPtr]::Zero, 0x0A06, 0x4003, 0x20)) { [void][T006.Hotkey]::UnregisterHotKey([IntPtr]::Zero, 0x0A06); return 0 }
            return [Runtime.InteropServices.Marshal]::GetLastWin32Error()
          }
          $exe = Join-Path $env:LOCALAPPDATA 'Voicen\voicen.exe'
          # voicen.log plus rolled voicen-*.log: a run crossing local midnight rolls the file (T-008).
          $log = Join-Path $env:LOCALAPPDATA 'Voicen\logs\voicen*.log'
          $expected = "($env:VOICEN_COMMIT) started"
          $before = Test-Hotkey
          if ($before -ne 0) { throw "premise: Ctrl+Alt+Space is not free before the launch (RegisterHotKey error $before)" }
          function Get-StartCount { if (Test-Path $log) { @(Select-String -Path $log -SimpleMatch $expected).Count } else { 0 } }
          $starts = Get-StartCount
          $proc = Start-Process -FilePath $exe -PassThru
          $started = $false
          for ($i = 0; $i -lt 30 -and -not $started; $i++) { Start-Sleep -Seconds 1; $started = (Get-StartCount) -gt $starts }
          if (-not $started) { Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue; throw "start log line with commit $env:VOICEN_COMMIT not written by the launch" }
          $held = 0
          for ($i = 0; $i -lt 30 -and $held -ne 1409; $i++) {
            if ($proc.HasExited) { throw "voicen.exe exited before it held the hotkey (exit code $($proc.ExitCode))" }
            $held = Test-Hotkey
            if ($held -ne 1409) { Start-Sleep -Milliseconds 500 }
          }
          Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
          if ($held -ne 1409) { throw "the running app does not hold Ctrl+Alt+Space within 15 s of its start line (last RegisterHotKey result: $held, expected error 1409)" }
          $freed = -1
          for ($i = 0; $i -lt 30 -and $freed -ne 0; $i++) { Start-Sleep -Milliseconds 500; $freed = Test-Hotkey }
          if ($freed -ne 0) { throw "Ctrl+Alt+Space is still taken 15 s after the app was stopped (RegisterHotKey error $freed)" }
          Write-Output "the running app held Ctrl+Alt+Space (RegisterHotKey error 1409) and freed it when stopped"
      - name: A .part left by an earlier run is deleted at start (T-044 LocalModels::open in run())
        shell: pwsh
        run: |
          $exe = Join-Path $env:LOCALAPPDATA 'Voicen\voicen.exe'
          # voicen.log plus rolled voicen-*.log: a run crossing local midnight rolls the file (T-008).
          $log = Join-Path $env:LOCALAPPDATA 'Voicen\logs\voicen*.log'
          $models = Join-Path $env:LOCALAPPDATA 'Voicen\models'
          $part = Join-Path $models 'ggml-base.bin.part'
          $expected = "($env:VOICEN_COMMIT) started"
          New-Item -ItemType Directory -Force -Path $models | Out-Null
          [System.IO.File]::WriteAllBytes($part, [byte[]]::new(1024))
          if (-not (Test-Path -LiteralPath $part -PathType Leaf)) { throw "could not place $part before the launch" }
          Write-Output "placed a stale $part"
          function Get-StartCount { if (Test-Path $log) { @(Select-String -Path $log -SimpleMatch $expected).Count } else { 0 } }
          $before = Get-StartCount
          $proc = Start-Process -FilePath $exe -PassThru
          $started = $false
          for ($i = 0; $i -lt 30 -and -not $started; $i++) { Start-Sleep -Seconds 1; $started = (Get-StartCount) -gt $before }
          # run() writes the start line, then opens the one LocalModels, whose cleanup deletes every *.part.
          $gone = $false
          for ($i = 0; $i -lt 10 -and $started -and -not $gone; $i++) {
            $gone = -not (Test-Path -LiteralPath $part)
            if (-not $gone) { Start-Sleep -Seconds 1 }
          }
          Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
          if (-not $started) { throw "start log line with commit $env:VOICEN_COMMIT not written by the launch with a stale .part" }
          if (-not $gone) { throw "$part is still present after the start line (cleanup_at_start not run at start)" }
          Write-Output "the stale $part is gone after the start line"
      - name: A second launch opens the one settings window and exits, touching none of the primary's files (T-052 single instance)
        shell: pwsh
        run: |
          . ./scripts/ci/visible-windows.ps1
          $exe = Join-Path $env:LOCALAPPDATA 'Voicen\voicen.exe'
          $settings = Join-Path $env:LOCALAPPDATA 'Voicen\settings.json'
          # voicen.log plus rolled voicen-*.log: a run crossing local midnight rolls the file (T-008).
          $log = Join-Path $env:LOCALAPPDATA 'Voicen\logs\voicen*.log'
          $models = Join-Path $env:LOCALAPPDATA 'Voicen\models'
          $part = Join-Path $models 'ggml-base.bin.part'
          $loadLine = 'settings load outcome=loaded'
          if (-not (Test-Path -LiteralPath $settings -PathType Leaf)) { throw "settings.json not found at $settings before the single-instance check" }
          function Get-LineCount([string]$text) { if (Test-Path $log) { @(Select-String -Path $log -SimpleMatch $text).Count } else { 0 } }
          # The set of every Started line ("... started pid=<pid>", each with its timestamp) over all log
          # files, taken before a Start-Process (T-052 review round 1 #5: a baseline taken after the
          # start could absorb a start line the child writes at once). Keyed by line, not by file
          # (T-057): a roll renames voicen.log to voicen-<stamp>.log (T-008), which keeps its lines, so
          # a per-file line count would skip the new voicen.log's first lines and recount the renamed
          # file from line 0.
          function Get-LogMark {
            $m = [System.Collections.Generic.HashSet[string]]::new()
            foreach ($f in @(Get-ChildItem -Path $log -ErrorAction SilentlyContinue)) {
              foreach ($l in @(Get-Content -LiteralPath $f.FullName | Select-String -SimpleMatch 'started pid=')) { [void]$m.Add($l.Line) }
            }
            , $m
          }
          # The Started lines of one pid ("... started pid=<pid>" at the end of the line) in any log file
          # that are not in $mark: the ones written since the mark, whatever file they are in now (a
          # retention delete of an old file only removes lines, so it cannot add to the count).
          function Get-StartCountSince($mark, [int]$id) {
            $n = 0
            foreach ($f in @(Get-ChildItem -Path $log -ErrorAction SilentlyContinue)) {
              foreach ($l in @(Get-Content -LiteralPath $f.FullName | Select-String -Pattern "started pid=$id(\D|$)")) { if (-not $mark.Contains($l.Line)) { $n++ } }
            }
            $n
          }
          $primary = $null; $second = $null; $third = $null
          function Stop-All { foreach ($p in @($primary, $second, $third)) { if ($p) { Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue } } }
          # The primary: a Loaded launch (no window). run() is build (the plugin decides), then the
          # log, the .part cleanup and the settings load, so a .part planted after its load line is
          # deleted by no one but a second process that ran the startup side effects.
          $loadsBefore = Get-LineCount $loadLine
          $primaryMark = Get-LogMark
          $primary = Start-Process -FilePath $exe -PassThru
          $null = $primary.Handle
          $ready = $false
          for ($i = 0; $i -lt 30 -and -not $ready; $i++) { Start-Sleep -Seconds 1; $ready = ((Get-StartCountSince $primaryMark $primary.Id) -ge 1) -and ((Get-LineCount $loadLine) -gt $loadsBefore) }
          if (-not $ready) { Stop-All; throw "the primary (pid $($primary.Id)) did not write its start and load lines" }
          $tray = $false
          for ($i = 0; $i -lt 30 -and -not $tray; $i++) { $tray = @(Get-AllWindows $primary.Id | Where-Object { $_.Class -ceq 'tray_icon_app' }).Count -ge 1; if (-not $tray) { Start-Sleep -Seconds 1 } }
          if (-not $tray) { $all = Format-AllWindows (Get-AllWindows $primary.Id); Stop-All; throw "no 'tray_icon_app' window of the primary (windows: $all)" }
          New-Item -ItemType Directory -Force -Path $models | Out-Null
          [System.IO.File]::WriteAllBytes($part, [byte[]]::new(1024))
          if (-not (Test-Path -LiteralPath $part -PathType Leaf)) { Stop-All; throw "could not place $part" }
          # Second launch (no --autostart): it exits 0 inside build() (the plugin hands argv to the
          # primary), writes no start line, deletes no .part; the primary opens the settings window.
          $secondMark = Get-LogMark
          $second = Start-Process -FilePath $exe -PassThru
          $null = $second.Handle
          if (-not $second.WaitForExit(30000)) { Stop-All; throw "the second launch (pid $($second.Id)) did not exit within 30 s (no single instance)" }
          if ($second.ExitCode -ne 0) { Stop-All; throw "the second launch exited with code $($second.ExitCode), expected 0" }
          $win = $null
          $seen = 'none'
          for ($i = 0; $i -lt 30 -and -not $win; $i++) {
            Start-Sleep -Seconds 1
            if ($primary.HasExited) { break }
            $shown = Get-ShownWindows $primary.Id
            $seen = Format-ShownWindows $shown
            if ($shown.Count -eq 1 -and $shown[0].Title -ceq 'Voicen') { $win = $shown[0] }
          }
          $secondLines = Get-StartCountSince $secondMark $second.Id
          $primaryLines = Get-StartCountSince $primaryMark $primary.Id
          $partKept = Test-Path -LiteralPath $part -PathType Leaf
          if ($primary.HasExited) { Stop-All; throw "the primary exited after the second launch" }
          if ($secondLines -ne 0) { Stop-All; throw "the second launch (pid $($second.Id)) wrote $secondLines start line(s) into the primary's log" }
          if ($primaryLines -ne 1) { Stop-All; throw "the primary's start line occurs $primaryLines times for this launch, expected 1" }
          if (-not $partKept) { Stop-All; throw "the second launch deleted the primary's $part" }
          if (-not $win) { Stop-All; throw "the second launch did not bring up exactly one shown window titled Voicen (last seen: $seen)" }
          Write-Output "second launch: exit 0, no start line of its own, the .part kept, one shown window: $seen"
          # Minimised, the one window comes back on a third launch (OQ-11 Q2 default: front, same window).
          Invoke-Minimize $win.Handle
          $iconic = $false
          for ($i = 0; $i -lt 10 -and -not $iconic; $i++) { Start-Sleep -Milliseconds 500; $iconic = Test-Iconic $win.Handle }
          if (-not $iconic) { Stop-All; throw "premise: the settings window did not minimise" }
          $third = Start-Process -FilePath $exe -PassThru
          $null = $third.Handle
          if (-not $third.WaitForExit(30000)) { Stop-All; throw "the third launch (pid $($third.Id)) did not exit within 30 s" }
          if ($third.ExitCode -ne 0) { Stop-All; throw "the third launch exited with code $($third.ExitCode), expected 0" }
          $restored = $false
          for ($i = 0; $i -lt 20 -and -not $restored; $i++) { Start-Sleep -Milliseconds 500; $restored = -not (Test-Iconic $win.Handle) }
          $shown = Get-ShownWindows $primary.Id
          $seen = Format-ShownWindows $shown
          $sameWindow = $shown.Count -eq 1 -and $shown[0].Handle -eq $win.Handle
          Stop-All
          Remove-Item -LiteralPath $part -Force -ErrorAction SilentlyContinue
          if (-not $restored) { throw "a launch while the settings window was minimised left it minimised" }
          if (-not $sameWindow) { throw "not the same one window after the third launch (seen: $seen)" }
          Write-Output "third launch: exit 0, the one window un-minimised: $seen"
      - name: The installed voicen.exe --purge-credentials removes every Voicen/ entry, keeps the others, exits 0 with no output and no app start (T-061)
        shell: pwsh
        run: |
          # Credential Manager entries only through scripts/ci/credentials.ps1: invariant in docs/decisions/windows-ci-runner.md (the CI helper rule).
          $exe = Join-Path $env:LOCALAPPDATA 'Voicen\voicen.exe'
          # voicen.log plus rolled voicen-*.log (T-008).
          $log = Join-Path $env:LOCALAPPDATA 'Voicen\logs\voicen*.log'
          $fake = 'sk-test-ci-purge-0000-not-a-real-key'
          $gone = @('Voicen/ci-purge-a', 'Voicen/ci-purge-b')
          $kept = 'VoicenOther/ci-keep'
          # No Voicen running: without the branch a running primary would take the call
          # through single-instance and exit 0 (a false green).
          Get-Process -Name voicen -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 2
          if (@(Get-Process -Name voicen -ErrorAction SilentlyContinue).Count -ne 0) { throw "premise: a voicen process is still running" }
          # Plant, presence and cleanup through the product's own calls and type (CredWriteW /
          # CredReadW / CredEnumerateW / CredDeleteW GENERIC; scripts/ci/credentials.ps1), never a
          # second tool's text output: run 37444780779 could not tell a refused write from a missed
          # list match. make check (scripts/ci/ci-credentials.sh) refuses any Credential Manager
          # entry point named outside credentials.ps1 in CI, so this step names only the helper's
          # functions. Every failed call throws with its Win32 error.
          . ./scripts/ci/credentials.ps1
          function Test-Cred([string]$target) { Test-VoicenCredential -Target $target }
          # Cleanup: a failed delete is printed (Write-Host) and counted; before a throw it never hides
          # the reason of the throw, at the end a count above 0 is red.
          function Remove-All { $failed = 0; foreach ($t in $gone + $kept) { try { Remove-VoicenCredential -Target $t } catch { $failed++; Write-Host "cleanup: $($_.Exception.Message)" } }; $failed }
          function Format-Listed([string]$prefix) { (@(Get-VoicenCredentials -Prefix $prefix) | ForEach-Object { "$($_.Target) (type $($_.Type))" }) -join ', ' }
          try {
            foreach ($t in $gone + $kept) {
              Add-VoicenCredential -Target $t -Secret $fake
              if (-not (Test-Cred $t)) { throw "premise: $t was written (Add-VoicenCredential ok) but Test-VoicenCredential does not find it" }
            }
            # The purge finds entries with CredEnumerateW "Voicen/*": both planted targets must be
            # listed there as GENERIC, and the outsider must not be.
            $listed = @(Get-VoicenCredentials -Prefix 'Voicen/')
            foreach ($t in $gone) { if (@($listed | Where-Object { $_.Target -ceq $t -and $_.Type -eq 1 }).Count -ne 1) { throw "premise: Get-VoicenCredentials 'Voicen/' does not list $t as one GENERIC entry (listed: $(Format-Listed 'Voicen/'))" } }
            if (@($listed | Where-Object { $_.Target -ceq $kept }).Count -ne 0) { throw "premise: Get-VoicenCredentials 'Voicen/' lists $kept, which is outside the prefix" }
          } catch { [void](Remove-All); throw }
          Write-Output "premise: $(($gone + $kept) -join ', ') planted and read back; Get-VoicenCredentials 'Voicen/' lists: $(Format-Listed 'Voicen/')"
          function Get-LogState { @(Get-ChildItem -Path $log -ErrorAction SilentlyContinue | ForEach-Object { "$($_.Name)|$($_.Length)|$($_.LastWriteTimeUtc.Ticks)" }) -join ';' }
          function Invoke-Purge([string]$tag) {
            $out = Join-Path $env:RUNNER_TEMP "purge-$tag.out"; $err = Join-Path $env:RUNNER_TEMP "purge-$tag.err"
            $logBefore = Get-LogState
            $p = Start-Process -FilePath $exe -ArgumentList '--purge-credentials' -PassThru -RedirectStandardOutput $out -RedirectStandardError $err
            $null = $p.Handle
            # Without the branch the app starts, stays in the tray and never exits.
            if (-not $p.WaitForExit(15000)) { Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue; [void](Remove-All); throw "--purge-credentials ($tag) did not exit within 15 s (the app started)" }
            if ($p.ExitCode -ne 0) { [void](Remove-All); throw "--purge-credentials ($tag) exited with $($p.ExitCode), expected 0" }
            foreach ($f in @($out, $err)) { $text = Get-Content -LiteralPath $f -Raw -ErrorAction SilentlyContinue; if ($text) { [void](Remove-All); throw "--purge-credentials ($tag) wrote output to $f (contains the fake key: $($text.Contains($fake)))" } }
            if ((Get-LogState) -ne $logBefore) { [void](Remove-All); throw "--purge-credentials ($tag) touched the log files" }
          }
          Invoke-Purge 'first'
          foreach ($t in $gone) { if (Test-Cred $t) { [void](Remove-All); throw "$t is still in Credential Manager after the purge" } }
          if (-not (Test-Cred $kept)) { [void](Remove-All); throw "$kept (outside Voicen/) was deleted by the purge" }
          # Nothing left under the prefix: still exit 0.
          Invoke-Purge 'second'
          if (-not (Test-Cred $kept)) { [void](Remove-All); throw "$kept was deleted by the second purge" }
          if ((Remove-All) -ne 0) { throw "cleanup: a Remove-VoicenCredential above failed (Win32 error printed)" }
          Write-Output "--purge-credentials: exit 0 twice within 15 s, Voicen/ci-purge-a and -b gone, $kept kept, no output, log files unchanged"
      # T-006 Refresh 5 (red test 3b): the release press path on a loaded launch. settings.json is
      # set to engine local_server at a refused loopback endpoint (127.0.0.1:1, the core tests'
      # refused address, F-004; Windows answers the refusal after ~2 s, F-005), then a 3 s SendInput
      # hold of Ctrl+Alt+Space (scripts/ci/hotkey-hold.ps1) must give exactly one new `dictation rec=`
      # line within 75 s (any outcome: with no capture endpoint on the runner, never probed, it is
      # `outcome=capture_failed mic=no_device` at the press; with one, a failed or no_speech job)
      # and no blocked line, and voicen.exe must still run afterwards (a release-build abort on the
      # press path, panic = "abort", ends the process). Raw facts only (F-003); settings.json is
      # restored and every voicen.exe stopped on every path.
      - name: A hotkey hold on a loaded launch writes exactly one dictation line and the app keeps running (T-006 release press path)
        shell: pwsh
        run: |
          . ./scripts/ci/hotkey-hold.ps1
          $exe = Join-Path $env:LOCALAPPDATA 'Voicen\voicen.exe'
          $settings = Join-Path $env:LOCALAPPDATA 'Voicen\settings.json'
          $log = Join-Path $env:LOCALAPPDATA 'Voicen\logs\voicen*.log'
          $started = "($env:VOICEN_COMMIT) started"
          $loadLine = 'settings load outcome=loaded'
          $recLine = 'dictation rec='
          $blockedLine = 'dictation outcome=blocked'
          Stop-AllVoicen
          if (-not (Test-Path -LiteralPath $settings -PathType Leaf)) { throw "premise: settings.json not found at $settings before the loaded hold" }
          $free = Test-HotkeyFree
          if ($free -ne 0) { throw "premise: Ctrl+Alt+Space is not free before the launch (RegisterHotKey error $free)" }
          $original = [System.IO.File]::ReadAllBytes($settings)
          $proc = $null
          $hold = 'not sent'
          $held = 0
          try {
            $json = [System.IO.File]::ReadAllText($settings) | ConvertFrom-Json
            $json.engine = 'local_server'
            $json.local_server.base_url = 'http://127.0.0.1:1/v1'
            [System.IO.File]::WriteAllText($settings, ($json | ConvertTo-Json -Depth 20))
            $startsBefore = (Get-VoicenLogLines $log $started).Count
            $loadsBefore = (Get-VoicenLogLines $log $loadLine).Count
            $recBefore = Get-VoicenLogLines $log $recLine
            $blockedBefore = (Get-VoicenLogLines $log $blockedLine).Count
            $proc = Start-Process -FilePath $exe -PassThru
            $null = $proc.Handle
            $ready = $false
            for ($i = 0; $i -lt 30 -and -not $ready -and -not $proc.HasExited; $i++) {
              Start-Sleep -Seconds 1
              $ready = ((Get-VoicenLogLines $log $started).Count -gt $startsBefore) -and ((Get-VoicenLogLines $log $loadLine).Count -gt $loadsBefore)
            }
            if (-not $ready) { throw "the launch did not write its start line and '$loadLine' within 30 s (exited: $($proc.HasExited))" }
            $held = Wait-HotkeyHeld $proc
            if ($held -ne 1409) { throw "the running app does not hold Ctrl+Alt+Space within 15 s of its load line (last RegisterHotKey result: $held, exited: $($proc.HasExited))" }
            $hold = Invoke-HotkeyHold -Seconds 3
            Write-Output $hold
            # Up to 75 s for the line (the local_server deadline is 60 s), then 5 s more so a second
            # line for the same hold would be seen.
            $seenAt = $null
            $clock = [Diagnostics.Stopwatch]::StartNew()
            while ($clock.Elapsed.TotalSeconds -lt 75 -and -not $seenAt) {
              if ((Get-VoicenLogLines $log $recLine).Count -gt $recBefore.Count) { $seenAt = $clock.Elapsed.TotalSeconds; break }
              if ($proc.HasExited) { break }
              Start-Sleep -Milliseconds 500
            }
            if ($seenAt) { Start-Sleep -Seconds 5 }
            $alive = -not $proc.HasExited
            $exitInfo = if ($alive) { 'running' } else { "exited with code $($proc.ExitCode)" }
            $recNew = @(Get-VoicenLogLines $log $recLine | Where-Object { $recBefore -notcontains $_ })
            $blockedNew = (Get-VoicenLogLines $log $blockedLine).Count - $blockedBefore
          } finally {
            if ($proc) { Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue }
            Stop-AllVoicen
            [System.IO.File]::WriteAllBytes($settings, $original)
          }
          Write-Output "new dictation lines after the hold ($exitInfo):"
          $recNew | ForEach-Object { Write-Output "  $_" }
          if (-not $alive) { throw "voicen.exe did not survive the hold on a loaded launch: $exitInfo" }
          if ($recNew.Count -ne 1) { throw "a 3 s hold on a loaded launch (engine local_server) gave $($recNew.Count) new 'dictation rec=' lines within 75 s, expected exactly 1" }
          if ($blockedNew -ne 0) { throw "a hold with engine local_server wrote $blockedNew blocked line(s)" }
          Write-Output "loaded launch: one hold, one dictation line after $([int]$seenAt) s, voicen.exe still running"
      # T-006 Refresh 5 (red test 3a): a first launch (no settings.json, so engine none) blocks the
      # press; the blocked press must leave exactly one `dictation outcome=blocked reason=no_engine`
      # line (written at the press) and no `dictation rec=` line, and the app keeps running. Before
      # T-006's fix a blocked press wrote nothing, so a press that arrived and one that never arrived
      # looked the same in voicen.log (Investigation, Refresh 5). settings.json is moved aside for
      # the launch and put back on every path.
      - name: A hotkey hold on a first launch (engine none) writes exactly one blocked line (T-006 blocked press is logged)
        shell: pwsh
        run: |
          . ./scripts/ci/hotkey-hold.ps1
          $exe = Join-Path $env:LOCALAPPDATA 'Voicen\voicen.exe'
          $settings = Join-Path $env:LOCALAPPDATA 'Voicen\settings.json'
          $aside = Join-Path $env:RUNNER_TEMP 't006-settings.json'
          $log = Join-Path $env:LOCALAPPDATA 'Voicen\logs\voicen*.log'
          $started = "($env:VOICEN_COMMIT) started"
          $loadLine = 'settings load outcome=first_run'
          $recLine = 'dictation rec='
          $blockedLine = 'dictation outcome=blocked reason=no_engine'
          Stop-AllVoicen
          if (-not (Test-Path -LiteralPath $settings -PathType Leaf)) { throw "premise: settings.json not found at $settings before the first-launch hold" }
          $free = Test-HotkeyFree
          if ($free -ne 0) { throw "premise: Ctrl+Alt+Space is not free before the launch (RegisterHotKey error $free)" }
          Move-Item -LiteralPath $settings -Destination $aside -Force
          $proc = $null
          $hold = 'not sent'
          try {
            $startsBefore = (Get-VoicenLogLines $log $started).Count
            $loadsBefore = (Get-VoicenLogLines $log $loadLine).Count
            $recBefore = (Get-VoicenLogLines $log $recLine).Count
            $blockedBefore = Get-VoicenLogLines $log $blockedLine
            $proc = Start-Process -FilePath $exe -PassThru
            $null = $proc.Handle
            $ready = $false
            for ($i = 0; $i -lt 30 -and -not $ready -and -not $proc.HasExited; $i++) {
              Start-Sleep -Seconds 1
              $ready = ((Get-VoicenLogLines $log $started).Count -gt $startsBefore) -and ((Get-VoicenLogLines $log $loadLine).Count -gt $loadsBefore)
            }
            if (-not $ready) { throw "the first launch did not write its start line and '$loadLine' within 30 s (exited: $($proc.HasExited))" }
            $held = Wait-HotkeyHeld $proc
            if ($held -ne 1409) { throw "the running app does not hold Ctrl+Alt+Space within 15 s of its load line (last RegisterHotKey result: $held, exited: $($proc.HasExited))" }
            $hold = Invoke-HotkeyHold -Seconds 3
            Write-Output $hold
            # The blocked line is written at the press: 15 s from the release, then 5 s more so a
            # second line for the same hold (a line per blocked action, a line at the release) would
            # be seen.
            $seenAt = $null
            $clock = [Diagnostics.Stopwatch]::StartNew()
            while ($clock.Elapsed.TotalSeconds -lt 15 -and -not $seenAt) {
              if ((Get-VoicenLogLines $log $blockedLine).Count -gt $blockedBefore.Count) { $seenAt = $clock.Elapsed.TotalSeconds; break }
              if ($proc.HasExited) { break }
              Start-Sleep -Milliseconds 500
            }
            Start-Sleep -Seconds 5
            $alive = -not $proc.HasExited
            $exitInfo = if ($alive) { 'running' } else { "exited with code $($proc.ExitCode)" }
            $blockedNew = @(Get-VoicenLogLines $log $blockedLine | Where-Object { $blockedBefore -notcontains $_ })
            $recNew = (Get-VoicenLogLines $log $recLine).Count - $recBefore
          } finally {
            if ($proc) { Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue }
            Stop-AllVoicen
            Move-Item -LiteralPath $aside -Destination $settings -Force
          }
          Write-Output "new blocked lines after the hold ($exitInfo):"
          $blockedNew | ForEach-Object { Write-Output "  $_" }
          if (-not $alive) { throw "voicen.exe did not survive the hold on a first launch: $exitInfo" }
          if ($blockedNew.Count -ne 1) { throw "a 3 s hold on a first launch (engine none) gave $($blockedNew.Count) new '$blockedLine' lines, expected exactly 1" }
          if ($recNew -ne 0) { throw "a blocked hold wrote $recNew 'dictation rec=' line(s)" }
          Write-Output "first launch: one blocked hold, one blocked line after $([int]$seenAt) s, no dictation rec= line, voicen.exe still running"
      # T-025 (FR-28 v4, spec 006 FR-021..024, decisions #76): the three install/uninstall steps
      # below come after every step that launches the app, in this order: W2 reinstall, W3
      # uninstall /S /KEEPDATA (then a silent reinstall), W4 uninstall /S (the install is gone
      # afterwards). Credential Manager is planted and observed only through
      # scripts/ci/credentials.ps1 (docs/decisions/windows-ci-runner.md); no step launches
      # voicen.exe, so no window predicate is involved. Raw facts only (F-003).
      #
      # W2: a same-version /P reinstall. The installer finds the existing install (same version,
      # passive) and runs the old uninstaller in place (uninstall.exe _?=<dir>), the one path on
      # which an installer starts the uninstaller: the forked template passes /UPDATE /P there, so
      # the uninstaller asks nothing, removes no data, keeps the credentials and keeps the HKCU Run
      # value written by Start with Windows (T-034). Red on the stock template (it deletes the Run
      # value without /UPDATE), and red with the hooks but no fork (the passive question blocks:
      # bounded at 120 s).
      - name: A same-version /P reinstall asks nothing within 120 s and keeps the data folder, the Voicen/ credential and the Run value (T-025 upgrade path)
        shell: pwsh
        run: |
          . ./scripts/ci/hotkey-hold.ps1
          . ./scripts/ci/credentials.ps1
          $dir = Join-Path $env:LOCALAPPDATA 'Voicen'
          $exe = Join-Path $dir 'voicen.exe'
          $settings = Join-Path $dir 'settings.json'
          $marker = Join-Path $dir 'ci-keep.txt'
          $run = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Run'
          $runValue = '"' + $exe + '" --autostart'
          $fake = 'sk-test-ci-uninstall-0000-not-a-real-key'
          $kept = @('Voicen/ci-uninstall', 'VoicenOther/ci-uninstall-keep')
          function Get-RunValue { (Get-ItemProperty -Path $run -Name 'Voicen' -ErrorAction SilentlyContinue).Voicen }
          function Remove-All { $failed = 0; foreach ($t in $kept) { try { Remove-VoicenCredential -Target $t } catch { $failed++; Write-Host "cleanup: $($_.Exception.Message)" } }; Remove-ItemProperty -Path $run -Name 'Voicen' -ErrorAction SilentlyContinue; $failed }
          Stop-AllVoicen
          if (-not (Test-Path -LiteralPath $settings -PathType Leaf)) { throw "premise: settings.json not found at $settings before the reinstall" }
          $settingsHash = (Get-FileHash -LiteralPath $settings -Algorithm SHA256).Hash
          $markerText = "ci-keep $env:VOICEN_COMMIT"
          Set-Content -LiteralPath $marker -Value $markerText -NoNewline
          New-ItemProperty -Path $run -Name 'Voicen' -PropertyType String -Value $runValue -Force | Out-Null
          if ((Get-RunValue) -ne $runValue) { [void](Remove-All); throw "premise: the HKCU Run value Voicen reads '$(Get-RunValue)' after writing '$runValue'" }
          try {
            foreach ($t in $kept) {
              Add-VoicenCredential -Target $t -Secret $fake
              if (-not (Test-VoicenCredential -Target $t)) { throw "premise: $t was written but Test-VoicenCredential does not find it" }
            }
          } catch { [void](Remove-All); throw }
          Write-Output "premise: settings.json, ci-keep.txt, the Run value '$runValue' and $($kept -join ', ') in place"
          $setup = Get-ChildItem target/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          $p = Start-Process $setup.FullName -ArgumentList '/P' -PassThru
          $null = $p.Handle
          if (-not $p.WaitForExit(120000)) {
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
            Get-Process -Name uninstall -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
            [void](Remove-All)
            throw "the same-version /P reinstall did not finish within 120 s: a question blocked the reinstall (the old uninstaller did not get /UPDATE /P)"
          }
          Stop-AllVoicen
          $bad = @()
          if ($p.ExitCode -ne 0) { $bad += "the /P reinstall exited with $($p.ExitCode), expected 0" }
          if (-not (Test-Path -LiteralPath $exe -PathType Leaf)) { $bad += "voicen.exe not found at $exe after the reinstall" }
          if (-not (Test-Path -LiteralPath $marker -PathType Leaf)) { $bad += "the data marker $marker was deleted by the reinstall" }
          elseif ((Get-Content -LiteralPath $marker -Raw) -ne $markerText) { $bad += "the data marker $marker changed during the reinstall" }
          if (-not (Test-Path -LiteralPath $settings -PathType Leaf)) { $bad += "settings.json was deleted by the reinstall" }
          elseif ((Get-FileHash -LiteralPath $settings -Algorithm SHA256).Hash -ne $settingsHash) { $bad += "settings.json changed during the reinstall" }
          foreach ($t in $kept) { if (-not (Test-VoicenCredential -Target $t)) { $bad += "$t was deleted by the reinstall" } }
          $after = Get-RunValue
          if ($after -ne $runValue) { $bad += "the HKCU Run value Voicen is '$after' after the reinstall, expected '$runValue' (kept on an installer-started uninstall)" }
          $cleanup = Remove-All
          if ($bad) { throw ($bad -join '; ') }
          if ($cleanup -ne 0) { throw "cleanup: a Remove-VoicenCredential above failed (Win32 error printed)" }
          Write-Output "same-version /P reinstall: exit 0 within 120 s; settings.json, ci-keep.txt, $($kept -join ', ') and the Run value kept"
      # W3: uninstall.exe /S /KEEPDATA keeps the data folder and the Voicen/ credentials and still
      # removes the Run value, the Start-menu shortcut and the uninstall key (a regression pin of
      # the hook's /KEEPDATA branch; green on the stock uninstaller). Without _?= the uninstaller
      # copies itself to %TEMP% and returns at once, so the step polls (60 s) and then waits for
      # that copy to end. Then a silent reinstall for W4.
      - name: uninstall.exe /S /KEEPDATA keeps the data folder and the Voicen/ credential, removes the Run value and the shortcut (T-025)
        shell: pwsh
        run: |
          . ./scripts/ci/hotkey-hold.ps1
          . ./scripts/ci/credentials.ps1
          $dir = Join-Path $env:LOCALAPPDATA 'Voicen'
          $exe = Join-Path $dir 'voicen.exe'
          $uninstaller = Join-Path $dir 'uninstall.exe'
          $settings = Join-Path $dir 'settings.json'
          $marker = Join-Path $dir 'ci-keep.txt'
          $shortcut = Join-Path $env:APPDATA 'Microsoft\Windows\Start Menu\Programs\Voicen.lnk'
          $uninstKey = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\Voicen'
          $run = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Run'
          $fake = 'sk-test-ci-keepdata-0000-not-a-real-key'
          $target = 'Voicen/ci-keepdata'
          function Get-RunValue { (Get-ItemProperty -Path $run -Name 'Voicen' -ErrorAction SilentlyContinue).Voicen }
          function Get-UninstallerCopies { @(Get-Process -ErrorAction SilentlyContinue | Where-Object { $_.Path -and $_.Path.StartsWith([IO.Path]::GetTempPath(), [StringComparison]::OrdinalIgnoreCase) -and $_.Path -like '*\~nsu*' }) }
          function Remove-All { $failed = 0; try { Remove-VoicenCredential -Target $target } catch { $failed++; Write-Host "cleanup: $($_.Exception.Message)" }; $failed }
          Stop-AllVoicen
          foreach ($p in @($exe, $uninstaller, $settings, $shortcut)) { if (-not (Test-Path -LiteralPath $p -PathType Leaf)) { throw "premise: $p not found before the uninstall" } }
          if (-not (Test-Path -LiteralPath $uninstKey)) { throw "premise: the uninstall key $uninstKey not found before the uninstall" }
          $markerText = "ci-keepdata $env:VOICEN_COMMIT"
          Set-Content -LiteralPath $marker -Value $markerText -NoNewline
          New-ItemProperty -Path $run -Name 'Voicen' -PropertyType String -Value ('"' + $exe + '" --autostart') -Force | Out-Null
          try {
            Add-VoicenCredential -Target $target -Secret $fake
            if (-not (Test-VoicenCredential -Target $target)) { throw "premise: $target was written but Test-VoicenCredential does not find it" }
          } catch { [void](Remove-All); throw }
          Write-Output "premise: installed, settings.json, ci-keep.txt, the Run value and $target in place"
          $p = Start-Process -FilePath $uninstaller -ArgumentList '/S', '/KEEPDATA' -PassThru
          $done = $false
          $clock = [Diagnostics.Stopwatch]::StartNew()
          while ($clock.Elapsed.TotalSeconds -lt 60 -and -not $done) {
            Start-Sleep -Seconds 1
            $done = -not (Test-Path -LiteralPath $exe) -and -not (Test-Path -LiteralPath $uninstaller) -and -not (Test-Path -LiteralPath $uninstKey) -and ($null -eq (Get-RunValue)) -and -not (Test-Path -LiteralPath $shortcut) -and ((Get-UninstallerCopies).Count -eq 0)
          }
          while ($clock.Elapsed.TotalSeconds -lt 60 -and (Get-UninstallerCopies).Count -gt 0) { Start-Sleep -Seconds 1 }
          # A deletion after the end state was first seen (a late hook) still counts.
          Start-Sleep -Seconds 3
          $bad = @()
          if (-not $done) { $bad += "the uninstall did not reach its end state within 60 s (voicen.exe present: $(Test-Path -LiteralPath $exe), uninstall.exe present: $(Test-Path -LiteralPath $uninstaller), uninstall key present: $(Test-Path -LiteralPath $uninstKey), uninstaller copies running: $((Get-UninstallerCopies).Count))" }
          if (-not (Test-Path -LiteralPath $marker -PathType Leaf)) { $bad += "/KEEPDATA: the data marker $marker was deleted" }
          if (-not (Test-Path -LiteralPath $settings -PathType Leaf)) { $bad += "/KEEPDATA: settings.json was deleted" }
          if (-not (Test-VoicenCredential -Target $target)) { $bad += "/KEEPDATA: $target was deleted" }
          if ($null -ne (Get-RunValue)) { $bad += "the HKCU Run value Voicen ('$(Get-RunValue)') is still present after the uninstall" }
          if (Test-Path -LiteralPath $shortcut) { $bad += "the shortcut $shortcut is still present after the uninstall" }
          if ($bad) { [void](Remove-All); Remove-ItemProperty -Path $run -Name 'Voicen' -ErrorAction SilentlyContinue; throw ($bad -join '; ') }
          Write-Output "uninstall /S /KEEPDATA: data folder, settings.json, ci-keep.txt and $target kept; Run value, shortcut, uninstall key, voicen.exe and uninstall.exe gone"
          # Reinstall for W4: a silent install over the kept data folder.
          $setup = Get-ChildItem target/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          Start-Process $setup.FullName -ArgumentList '/S' -Wait
          foreach ($q in @($exe, $uninstaller, $shortcut, $marker)) { if (-not (Test-Path -LiteralPath $q -PathType Leaf)) { [void](Remove-All); throw "after the silent reinstall: $q not found" } }
          if ((Remove-All) -ne 0) { throw "cleanup: a Remove-VoicenCredential above failed (Win32 error printed)" }
          Write-Output "silent reinstall over the kept data: voicen.exe, uninstall.exe, the shortcut and ci-keep.txt present"
      # W4: a user-started silent uninstall (the default answer Yes) removes %LOCALAPPDATA%\Voicen
      # and every Voicen/ credential (voicen.exe --purge-credentials from the PREUNINSTALL hook,
      # T-061), keeps a credential outside the prefix, and removes the Run value, the shortcut and
      # the uninstall key. Red on the stock uninstaller (the folder and the credential stay).
      - name: uninstall.exe /S removes the data folder, every Voicen/ credential, the Run value and the shortcut, and keeps other credentials (T-025)
        shell: pwsh
        run: |
          . ./scripts/ci/hotkey-hold.ps1
          . ./scripts/ci/credentials.ps1
          $dir = Join-Path $env:LOCALAPPDATA 'Voicen'
          $exe = Join-Path $dir 'voicen.exe'
          $uninstaller = Join-Path $dir 'uninstall.exe'
          $settings = Join-Path $dir 'settings.json'
          $marker = Join-Path $dir 'ci-keep.txt'
          $shortcut = Join-Path $env:APPDATA 'Microsoft\Windows\Start Menu\Programs\Voicen.lnk'
          $uninstKey = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\Voicen'
          $run = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Run'
          $fake = 'sk-test-ci-uninstall-0000-not-a-real-key'
          $gone = 'Voicen/ci-uninstall'
          $outsider = 'VoicenOther/ci-uninstall-keep'
          function Get-RunValue { (Get-ItemProperty -Path $run -Name 'Voicen' -ErrorAction SilentlyContinue).Voicen }
          function Get-UninstallerCopies { @(Get-Process -ErrorAction SilentlyContinue | Where-Object { $_.Path -and $_.Path.StartsWith([IO.Path]::GetTempPath(), [StringComparison]::OrdinalIgnoreCase) -and $_.Path -like '*\~nsu*' }) }
          function Format-Listed { (@(Get-VoicenCredentials -Prefix 'Voicen/') | ForEach-Object { "$($_.Target) (type $($_.Type))" }) -join ', ' }
          function Remove-All { $failed = 0; foreach ($t in @($gone, $outsider)) { try { Remove-VoicenCredential -Target $t } catch { $failed++; Write-Host "cleanup: $($_.Exception.Message)" } }; Remove-ItemProperty -Path $run -Name 'Voicen' -ErrorAction SilentlyContinue; $failed }
          Stop-AllVoicen
          foreach ($p in @($exe, $uninstaller, $settings, $marker, $shortcut)) { if (-not (Test-Path -LiteralPath $p -PathType Leaf)) { throw "premise: $p not found before the uninstall" } }
          if (-not (Test-Path -LiteralPath $uninstKey)) { throw "premise: the uninstall key $uninstKey not found before the uninstall" }
          New-ItemProperty -Path $run -Name 'Voicen' -PropertyType String -Value ('"' + $exe + '" --autostart') -Force | Out-Null
          try {
            foreach ($t in @($gone, $outsider)) {
              Add-VoicenCredential -Target $t -Secret $fake
              if (-not (Test-VoicenCredential -Target $t)) { throw "premise: $t was written but Test-VoicenCredential does not find it" }
            }
            if (@(Get-VoicenCredentials -Prefix 'Voicen/' | Where-Object { $_.Target -ceq $gone }).Count -ne 1) { throw "premise: Get-VoicenCredentials 'Voicen/' does not list $gone (listed: $(Format-Listed))" }
          } catch { [void](Remove-All); throw }
          Write-Output "premise: installed, settings.json, ci-keep.txt, the Run value, $gone and $outsider in place"
          $p = Start-Process -FilePath $uninstaller -ArgumentList '/S' -PassThru
          $done = $false
          $clock = [Diagnostics.Stopwatch]::StartNew()
          while ($clock.Elapsed.TotalSeconds -lt 60 -and -not $done) {
            Start-Sleep -Seconds 1
            $done = -not (Test-Path -LiteralPath $dir) -and -not (Test-Path -LiteralPath $uninstKey) -and ($null -eq (Get-RunValue)) -and -not (Test-Path -LiteralPath $shortcut) -and (@(Get-VoicenCredentials -Prefix 'Voicen/').Count -eq 0) -and ((Get-UninstallerCopies).Count -eq 0)
          }
          while ($clock.Elapsed.TotalSeconds -lt 60 -and (Get-UninstallerCopies).Count -gt 0) { Start-Sleep -Seconds 1 }
          Start-Sleep -Seconds 3
          $bad = @()
          if (Test-Path -LiteralPath $dir) { $bad += "$dir is still present 60 s after uninstall.exe /S (left: $((@(Get-ChildItem -LiteralPath $dir -Recurse -Force -ErrorAction SilentlyContinue | ForEach-Object { $_.FullName.Substring($dir.Length) }) | Select-Object -First 20) -join ', '))" }
          $left = @(Get-VoicenCredentials -Prefix 'Voicen/')
          if ($left.Count -ne 0) { $bad += "Voicen/ credentials left after uninstall.exe /S: $(Format-Listed)" }
          if (-not (Test-VoicenCredential -Target $outsider)) { $bad += "$outsider (outside Voicen/) was deleted by the uninstall" }
          if ($null -ne (Get-RunValue)) { $bad += "the HKCU Run value Voicen ('$(Get-RunValue)') is still present after the uninstall" }
          if (Test-Path -LiteralPath $shortcut) { $bad += "the shortcut $shortcut is still present after the uninstall" }
          if (Test-Path -LiteralPath $uninstKey) { $bad += "the uninstall key $uninstKey is still present after the uninstall" }
          if ((Get-UninstallerCopies).Count -gt 0) { $bad += "an uninstaller copy in %TEMP% is still running 60 s after the start" }
          $cleanup = Remove-All
          if ($bad) { throw ($bad -join '; ') }
          if ($cleanup -ne 0) { throw "cleanup: a Remove-VoicenCredential above failed (Win32 error printed)" }
          Write-Output "uninstall /S: $dir, every Voicen/ credential, the Run value, the shortcut and the uninstall key gone; $outsider kept"
      - uses: actions/upload-artifact@v4
        with:
          name: voicen-installer-${{ env.VOICEN_COMMIT }}
          path: target/release/bundle/nsis/*-setup.exe
      # T-070 (decisions #93): the installer goes to the owner's Telegram chat on main and v* tags.
      # The premises run on every ref (wip included, P-016): red when there is not exactly one
      # *-setup.exe, its name lacks _<tauri.conf.json version>_ or that version is not the stamped
      # VOICEN_VERSION (T-077); a file of 50 MB or more (Bot API
      # upload limit) is a warning and send=false. The send is one script, scripts/ci/telegram-send.sh
      # (contract in its header, host test scripts/ci/telegram-send.test.sh in make check): token and
      # chat id reach curl only as config on stdin; no token -> one line, exit 0; a Telegram or network
      # failure is a ::warning:: (curl exit code and API description), never red. The failure-branch
      # step runs that script with an obviously fake token (Telegram refuses it, nothing reaches a
      # chat) on every ref except main and v* tags (wip/** and pull requests, P-016) when send=true;
      # scripts/ci/telegram-failure-branch.sh (host test in make check) judges it: red only when the
      # script exits non-zero, prints no ::warning:: or prints the fake token; Telegram not reached
      # (API description none) is a ::warning::, green. So no Telegram step can turn main or a tag
      # red or skip the send. The main/v* step runs the script with the secrets, consumes only the
      # premise step's outputs, and its if: has no status function, so it never runs after a red step.
      - name: Installer for Telegram
        id: telegram-installer
        shell: bash
        run: |
          shopt -s nullglob
          files=(target/release/bundle/nsis/*-setup.exe)
          if [ "${#files[@]}" != 1 ]; then echo "::error::installer for Telegram: ${#files[@]} *-setup.exe files in target/release/bundle/nsis, expected exactly 1"; exit 1; fi
          installer="${files[0]}"
          version="$(sed -n 's/^[[:space:]]*"version":[[:space:]]*"\([^"]*\)".*/\1/p' src-tauri/tauri.conf.json | head -n 1)"
          if [ -z "$version" ]; then echo "::error::installer for Telegram: no version in src-tauri/tauri.conf.json"; exit 1; fi
          if [ "$version" != "${VOICEN_VERSION:-}" ]; then echo "::error::installer for Telegram: src-tauri/tauri.conf.json version '$version' differs from the stamped VOICEN_VERSION '${VOICEN_VERSION:-}' (step Version of this build)"; exit 1; fi
          case "$(basename "$installer")" in
            *"_${version}_"*) ;;
            *) echo "::error::installer for Telegram: $(basename "$installer") does not contain _${version}_ (src-tauri/tauri.conf.json version)"; exit 1 ;;
          esac
          size=$(wc -c < "$installer" | tr -d '[:space:]')
          limit=$((50 * 1024 * 1024))
          send=true
          if [ "$size" -ge "$limit" ]; then echo "::warning::installer for Telegram: $installer is $size bytes, the Bot API upload limit is $limit; it will not be sent"; send=false; fi
          caption="Voicen ${version}, ${GITHUB_REF_NAME} @ ${VOICEN_COMMIT}, run ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          echo "installer: $installer ($size bytes, limit $limit, send=$send)"
          echo "caption: $caption"
          curl --version
          {
            printf 'path=%s\n' "$installer"
            printf 'caption=%s\n' "$caption"
            printf 'send=%s\n' "$send"
          } >> "$GITHUB_OUTPUT"
      - name: Telegram send failure branch (fake token, nothing reaches a chat)
        if: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/v') && steps.telegram-installer.outputs.send == 'true' }}
        timeout-minutes: 10
        shell: bash
        env:
          INSTALLER: ${{ steps.telegram-installer.outputs.path }}
          CAPTION: ${{ steps.telegram-installer.outputs.caption }}
        run: |
          fake='0:voicen-ci-example-fake-not-a-secret'
          rc=0
          out="$(TELEGRAM_BOT_TOKEN="$fake" TELEGRAM_CHAT_ID=1 bash scripts/ci/telegram-send.sh "$INSTALLER" "$CAPTION" 2>&1)" || rc=$?
          sed 's/^/telegram-send: /' <<<"$out"
          bash scripts/ci/telegram-failure-branch.sh "$rc" "$fake" <<<"$out"
      - name: Send the installer to Telegram (main and v* tags only)
        if: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) && steps.telegram-installer.outputs.send == 'true' }}
        timeout-minutes: 10
        shell: bash
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          INSTALLER: ${{ steps.telegram-installer.outputs.path }}
          CAPTION: ${{ steps.telegram-installer.outputs.caption }}
        run: bash scripts/ci/telegram-send.sh "$INSTALLER" "$CAPTION"
      # T-059: runner capability facts for later Windows CI tests (docs/decisions/windows-ci-runner.md).
      # A missing capability is a result line, never a red step; red only when the probe is defective:
      # its test fails (pipefail), there is not exactly one end line, or the number of well-formed fact
      # lines (or of all runner-probe lines but the end line) differs from it. The test is #[ignore], so
      # the cargo test -p voicen step above only starts its exe; --no-capture because libtest swallows
      # what a passing test prints. Last and !cancelled(): a probe defect cannot skip the deploy steps,
      # and the facts print even when an earlier step failed.
      - name: Runner capability probe (T-059; facts only, a missing capability is a result; docs/decisions/windows-ci-runner.md)
        if: ${{ !cancelled() }}
        timeout-minutes: 10
        shell: bash
        run: |
          cargo test -p voicen --test runner_probe -- --ignored --no-capture --test-threads=1 | tee runner-probe.log
          tr -d '\r' < runner-probe.log > runner-probe.lines
          count() { awk -v re="$1" '$0 ~ re { n++ } END { print n + 0 }' runner-probe.lines; }
          ends=$(count '^runner-probe: end[(]facts=[0-9]+[)]$')
          if [ "$ends" != 1 ]; then echo "::error::runner probe: $ends end lines, expected exactly 1"; exit 1; fi
          want=$(sed -nE 's/^runner-probe: end[(]facts=([0-9]+)[)]$/\1/p' runner-probe.lines)
          facts=$(count '^runner-probe: [a-z_]+=(ok|denied|lost|absent|skipped|timeout)([(][^()]*[)])?$')
          all=$(count '^runner-probe: ')
          if [ "$facts" != "$want" ] || [ "$all" != "$((want + 1))" ]; then echo "::error::runner probe: $facts well-formed fact lines and $all runner-probe lines, the end line says facts=$want"; exit 1; fi
          echo "runner probe: $facts fact lines, as the end line says"
