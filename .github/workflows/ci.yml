name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  gate:
    name: Gate (make check)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: "20.19"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Build the core toolchain image
        run: make core-image
      - run: make check

  windows:
    name: Windows build, install and smoke test
    needs: gate
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: "20.19"
          cache: pnpm
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.0"
      - uses: Swatinem/rust-cache@v2
      - name: Commit of this build
        shell: bash
        run: echo "VOICEN_COMMIT=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_ENV"
      - run: pnpm install --frozen-lockfile
      - run: cargo test --workspace
      - run: pnpm tauri build
      - name: Install silently, launch, check the start log line carries the commit
        shell: pwsh
        run: |
          $setup = Get-ChildItem target/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          Start-Process $setup.FullName -ArgumentList '/S' -Wait
          $exe = Get-ChildItem (Join-Path $env:LOCALAPPDATA 'Voicen') -Filter voicen.exe -Recurse | Select-Object -First 1
          if (-not $exe) { throw "voicen.exe not found after install" }
          $proc = Start-Process $exe.FullName -PassThru
          $log = Join-Path $env:LOCALAPPDATA 'Voicen\logs\voicen.log'
          $expected = "($env:VOICEN_COMMIT) started"
          $found = $false
          for ($i = 0; $i -lt 30 -and -not $found; $i++) {
            Start-Sleep -Seconds 1
            $found = (Test-Path $log) -and (Select-String -Path $log -SimpleMatch $expected -Quiet)
          }
          Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
          if (-not $found) { if (Test-Path $log) { Get-Content $log }; throw "start log line with commit $env:VOICEN_COMMIT not found" }
          Get-Content $log
      - uses: actions/upload-artifact@v4
        with:
          name: voicen-installer-${{ env.VOICEN_COMMIT }}
          path: target/release/bundle/nsis/*-setup.exe
