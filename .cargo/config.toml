# Build environment for every cargo invocation in this workspace (decision #44).
[env]
# aws-lc-sys (rustls -> aws-lc-rs, via reqwest in voicen-core) needs NASM on
# x86_64-pc-windows-msvc. "1" uses the NASM objects shipped inside the crate
# (builder/prebuilt-nasm/, no download); a NASM on PATH is still used when present.
# On the Linux gate it matters only for `make check-shell-windows` (x86_64-pc-windows-gnu,
# no NASM in the image): aws-lc-sys uses the same shipped objects there (T-056). The
# native Linux build has no NASM step.
AWS_LC_SYS_PREBUILT_NASM = "1"

# whisper.cpp (whisper-rs-sys 0.15.0, crates/voicen-whisper; T-099). Its build script passes
# every GGML_* / CMAKE_* variable to cmake as a -D define; force = true, so a variable of the
# calling shell cannot change these. Proven on the build the CI job makes, not here:
# scripts/ci/whisper-cmake-cache.sh reads the effective CMakeCache.txt, scripts/ci/crt-imports.sh
# the exes' imports (docs/decisions/ci-toolchain.md).
#
# CPU baseline (decision #142): one static build that never depends on the build machine's CPU.
# GGML_NATIVE=OFF stops ggml from detecting the CI runner's CPU; the four x86 options equal the
# ggml defaults but are explicit, because a cross build or SOURCE_DATE_EPOCH turns those
# defaults off (a build with no SIMD at all). CPUs without AVX2 are unsupported.
GGML_NATIVE = { value = "OFF", force = true }
GGML_SSE42 = { value = "ON", force = true }
GGML_AVX = { value = "ON", force = true }
GGML_AVX2 = { value = "ON", force = true }
GGML_BMI2 = { value = "ON", force = true }
# AVX-VNNI is outside the AVX2 baseline and its option sits outside the AVX512 / AVX2 chain, so a
# GGML_AVX_VNNI=ON of the calling shell would add AVX-VNNI code; pinned OFF (the ggml default).
GGML_AVX_VNNI = { value = "OFF", force = true }
# C runtime (T-099 invariant 4): whisper.cpp is compiled /MT (static vcruntime, libcmt, libcpmt),
# the CRT of the shell (tauri-build static_vcruntime), so no exe imports MSVCP140 or
# VCRUNTIME140. whisper.cpp's cmake_minimum_required leaves policy CMP0091 unset, so the
# runtime setting needs the policy default. The flag values are given explicitly because
# cmake-rs otherwise writes cc-rs's -MD into CMAKE_<LANG>_FLAGS and, for the Visual Studio
# generator, into CMAKE_<LANG>_FLAGS_<BUILD TYPE>; once defined, cmake-rs adds nothing, so
# they carry what it would add (-nologo, whisper-rs-sys's /utf-8) and CMake's MSVC defaults
# (/DWIN32 /D_WINDOWS, /GR /EHsc for C++, the optimisation flags of the two build types
# whisper-rs-sys uses). MSVC values: whisper.cpp builds for the MSVC target only (the Linux
# gate type-checks voicen-whisper with DOCS_RS=1, which skips cmake).
CMAKE_POLICY_DEFAULT_CMP0091 = { value = "NEW", force = true }
CMAKE_MSVC_RUNTIME_LIBRARY = { value = "MultiThreaded", force = true }
CMAKE_C_FLAGS = { value = "-nologo /DWIN32 /D_WINDOWS", force = true }
CMAKE_CXX_FLAGS = { value = "-nologo /DWIN32 /D_WINDOWS /GR /EHsc /utf-8", force = true }
CMAKE_C_FLAGS_RELEASE = { value = "/O2 /Ob2 /DNDEBUG", force = true }
CMAKE_CXX_FLAGS_RELEASE = { value = "/O2 /Ob2 /DNDEBUG", force = true }
CMAKE_C_FLAGS_RELWITHDEBINFO = { value = "/O2 /Ob1 /DNDEBUG", force = true }
CMAKE_CXX_FLAGS_RELWITHDEBINFO = { value = "/O2 /Ob1 /DNDEBUG", force = true }

# libopus (opusic-sys 0.7.5, bundled, crates/voicen-core; T-117, decisions #197): built /MT, the
# shell's CRT. opusic-sys forwards no environment to cmake, and cmake-rs reads from it only the
# toolchain file (and generator, prefix path), so the setting lives in cmake/msvc-static-crt.cmake.
# Target-scoped on purpose: once a toolchain file is defined, cmake-rs stops passing
# CMAKE_SYSTEM_NAME (cross builds) and CMAKE_C_COMPILER, which the native Linux build and the mingw
# build of `make check-shell-windows` need; cmake-rs tries CMAKE_TOOLCHAIN_FILE_<target with _>
# before the plain name, so only x86_64-pc-windows-msvc builds load it (whisper-rs-sys too, which
# reads nothing it sets). relative = true: cargo passes the absolute path. A restored build cache
# keeps an old opusic-sys OUT_DIR (its build script does not rerun on this variable), so the
# windows job drops it before the first cargo command. Proven on the CI build:
# scripts/ci/opus-cmake-cache.sh (docs/decisions/ci-toolchain.md).
CMAKE_TOOLCHAIN_FILE_x86_64_pc_windows_msvc = { value = "cmake/msvc-static-crt.cmake", relative = true, force = true }
