# Build environment for every cargo invocation in this workspace (decision #44).
[env]
# aws-lc-sys (rustls -> aws-lc-rs, via reqwest in voicen-core) needs NASM on
# x86_64-pc-windows-msvc. "1" uses the NASM objects shipped inside the crate
# (builder/prebuilt-nasm/, no download); a NASM on PATH is still used when present.
# No effect on the Linux gate (no NASM step there).
AWS_LC_SYS_PREBUILT_NASM = "1"
