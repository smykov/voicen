[workspace]
members = ["crates/voicen-core", "crates/voicen-whisper", "src-tauri"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.90"

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = "none"

# T-101 (decisions #135, #200 D1): line tables for the workspace packages only, so crash frames map
# to lines through the PDB. Never profile-wide and never package."*": a dependency's build script
# would see DEBUG=true and cmake would build libopus as RelWithDebInfo.
[profile.release.package.voicen]
debug = "line-tables-only"

[profile.release.package.voicen-core]
debug = "line-tables-only"

[profile.release.package.voicen-whisper]
debug = "line-tables-only"

# T-124: the call timeline streams every sample through rubato's sinc resampler; unoptimized,
# the 60-minute drift test takes over 10 minutes. Only this pure-Rust dependency is optimized
# in dev/test builds (no build script, so nothing else sees the change).
[profile.dev.package.rubato]
opt-level = 3
