# cargo-about configuration and the ONE accepted-license list of the project (T-027).
# The list is decision #9 plus the five licenses decision #24 added. It is read by
# cargo-about (Rust crates) and by scripts/licenses/accepted.mjs (npm bundle and
# licenses/manual.json). Changing it is an owner decision: add a docs/decisions.md row
# first, never edit the list alone (P-010).
accepted = [
    # decision #9
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "MPL-2.0",
    "Unlicense",
    "CC0-1.0",
    # decision #24
    "Apache-2.0 WITH LLVM-exception",
    "0BSD",
    "BSL-1.0",
    "Unicode-DFS-2016",
    "CDLA-Permissive-2.0",
]

# Only what ships: the Windows target's normal dependency graph.
# Keys checked against cargo-about 0.9.2 (src/licenses/config.rs): `targets`,
# `ignore-build-dependencies`, `ignore-dev-dependencies`. There is no clearlydefined.io key:
# 0.8.0 removed those lookups, and any other top-level key is read as a per-crate table.
# scripts/licenses/rust.sh runs `generate --frozen`, so nothing is fetched at check time.
targets = ["x86_64-pc-windows-msvc"]
ignore-build-dependencies = true
ignore-dev-dependencies = true
